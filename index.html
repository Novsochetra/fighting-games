<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Steel &amp; Dust</title>
<meta name="description" content="A side-scrolling pixel-art brawler. Pick up weapons, chain combos and fight through three zones to the boss.">
<meta name="theme-color" content="#0c0910">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Steel &amp; Dust">
<link rel="manifest" href="assets/manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* The page is only the game: a letterboxed 16:9 canvas filling the screen, DOM menus on top,
   and a touch overlay (floating stick on the left, action buttons on the right) on phones and tablets. */
:root{
  --bg:#0c0910; --panel:#1d1727; --panel2:#2a2036; --line:#3d3150; --ink:#0c0910;
  --fg:#f1e7d6; --muted:#a397ae; --amber:#f2a33a; --amberL:#ffd38a; --teal:#4fb3a9; --red:#e0533d; --gold:#e8c06a; --green:#59c9a5;
  --display:'Silkscreen','Courier New',monospace;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --btn:1; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#000;color:var(--fg);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
/* phones: no text selection, no long-press callout, no double-tap zoom. Set on every element, because iPhone Safari
   ignores user-scalable=no and does not reliably pass these down from body */
#app,#app *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#stage,#stage *,.touch,.touch *{touch-action:none;}
#menus .menu,#menus .menu *{touch-action:manipulation;}
#menus .box .scroll,#menus .box .scroll *{touch-action:pan-y;}
body{font-family:var(--body);font-size:16px;line-height:1.45;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;}
#app{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#1f1628 0,#08060b 70%);}
#stage{position:absolute;left:0;top:0;width:768px;height:432px;box-shadow:0 0 0 1px #1d1727,0 18px 60px rgba(0,0,0,.6);}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--bg);outline:none;}

/* ---------- menus ---------- */
#menus{position:absolute;inset:0;pointer-events:none;}
.menu{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:auto;
  padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));overflow-y:auto;background:rgba(8,6,11,.58);}
.menu.open{display:flex;animation:menuIn .2s ease-out;}
.menu.sub{background:rgba(8,6,11,.8);}
@keyframes menuIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(34px,8.5vmin,84px);line-height:.95;margin:0;text-align:center;letter-spacing:.02em;color:var(--amber);
  text-shadow:3px 3px 0 #a3301f,6px 6px 0 #000;animation:logoIn .6s cubic-bezier(.2,1.6,.4,1) both;}
.logo span{display:block;font-size:.38em;color:var(--fg);letter-spacing:.3em;text-shadow:2px 2px 0 #000;margin-top:.35em;}
@keyframes logoIn{from{opacity:0;transform:scale(.6);}to{opacity:1;transform:none;}}
.mtitle{font-family:var(--display);font-weight:700;font-size:clamp(26px,6vmin,52px);margin:0 0 6px;text-align:center;color:var(--fg);text-shadow:3px 3px 0 #000;}
.mtitle.bad{color:var(--red);} .mtitle.good{color:var(--amber);}
.mlist{display:flex;flex-direction:column;gap:8px;width:min(300px,82vw);margin-top:8px;}
.mbtn{font-family:var(--display);font-size:clamp(14px,2.4vmin,19px);letter-spacing:.04em;padding:11px 16px;color:var(--fg);background:var(--panel);border:2px solid var(--line);
  box-shadow:4px 4px 0 #000;cursor:pointer;text-align:center;text-transform:uppercase;transition:transform .06s;}
.mbtn:hover,.mbtn.sel{background:var(--amber);color:var(--ink);border-color:var(--amberL);}
.mbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000;}
.mbtn.primary{background:#3a2a18;border-color:var(--amber);}
.mbtn.primary:hover,.mbtn.primary.sel{background:var(--amber);}
.mbtn:focus{outline:none;}
.mnote{color:var(--muted);font-size:14px;text-align:center;margin:4px 0 0;max-width:46ch;}
.mnote b{color:var(--fg);font-weight:600;}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 28px;font-family:var(--display);font-size:clamp(13px,2.2vmin,17px);margin:4px 0 6px;}
.stats dt{color:var(--muted);} .stats dd{margin:0;text-align:right;color:var(--fg);}
.stats .new{color:var(--amber);}
.hint{position:absolute;left:0;right:0;bottom:calc(10px + var(--sab));text-align:center;font-size:13px;color:var(--muted);pointer-events:none;}
.hint kbd,.mnote kbd{font-family:var(--display);font-size:11px;padding:1px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;background:var(--panel2);color:var(--fg);}

/* panels: settings and how to play */
.box{background:var(--panel);border:2px solid var(--line);box-shadow:6px 6px 0 #000;width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0;}
.box header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:2px solid var(--line);}
.box h2{font-family:var(--display);font-size:18px;margin:0;color:var(--amber);letter-spacing:.06em;}
.box .scroll{overflow-y:auto;padding:12px 14px 16px;min-height:0;touch-action:pan-y;}
.xbtn{font-family:var(--display);font-size:13px;padding:7px 12px;background:var(--panel2);border:2px solid var(--line);cursor:pointer;box-shadow:3px 3px 0 #000;}
.xbtn:hover,.xbtn.sel{background:var(--amber);color:var(--ink);border-color:var(--amberL);}
.group{font-family:var(--display);font-size:12px;color:var(--muted);letter-spacing:.1em;margin:14px 0 6px;}
.group:first-child{margin-top:0;}
.setrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 14px;padding:7px 8px;border:2px solid transparent;cursor:default;}
.setrow:nth-child(even){background:rgba(255,255,255,.025);}
.setrow.sel{border-color:var(--amber);background:rgba(242,163,58,.08);}
.setrow .lbl{font-weight:600;} .setrow .lbl small{display:block;font-weight:400;color:var(--muted);font-size:13px;}
.stepper{display:flex;align-items:center;gap:6px;}
.stepper button{width:34px;height:34px;font-family:var(--display);font-size:16px;background:var(--panel2);border:2px solid var(--line);cursor:pointer;box-shadow:2px 2px 0 #000;}
.stepper button:hover{background:var(--amber);color:var(--ink);}
.stepper .val{min-width:96px;text-align:center;font-family:var(--display);font-size:14px;color:var(--amber);}
.meter{display:inline-block;width:60px;height:8px;background:#0c0910;border:1px solid var(--line);vertical-align:middle;margin-left:6px;position:relative;}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--amber);}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;}
.tabs button{font-family:var(--display);font-size:12px;letter-spacing:.04em;color:var(--muted);background:transparent;border:2px solid var(--line);padding:6px 10px;cursor:pointer;}
.tabs button[aria-selected="true"]{background:var(--amber);color:var(--ink);border-color:var(--amber);}
.tabs button.sel{outline:2px solid var(--amberL);outline-offset:1px;}
.keys{width:100%;border-collapse:collapse;font-size:15px;}
.keys td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top;}
.keys td:first-child{color:var(--muted);padding-right:14px;white-space:nowrap;}
kbd.k{font-family:var(--display);font-size:11px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;background:var(--panel2);color:var(--fg);white-space:nowrap;}
.wmeta{color:var(--muted);margin:0 0 8px;font-size:14px;} .wmeta b{color:var(--fg);}
.moves{width:100%;border-collapse:collapse;font-size:14px;}
.moves th{font-family:var(--display);font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;background:var(--panel2);}
.moves td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle;}
.moves td.num{text-align:right;font-variant-numeric:tabular-nums;}
.tag-l{display:inline-block;font-size:11px;color:var(--teal);border:1px solid #2f5f5b;border-radius:3px;padding:0 5px;margin:1px 3px 1px 0;white-space:nowrap;}
.tips{margin:0;padding-left:18px;} .tips li{margin:0 0 8px;color:var(--fg);} .tips b{color:var(--amber);}
.try{margin:10px 0 0;font-size:14px;color:var(--muted);} .try b{font-family:var(--display);font-size:12px;color:var(--amber);margin-right:6px;}

/* ---------- touch controls ---------- */
.touch{position:absolute;inset:0;pointer-events:none;display:none;}
body.touch-on .touch.live{display:block;}
.stick-zone{position:absolute;left:0;top:0;bottom:0;width:48%;pointer-events:auto;touch-action:none;}
.stick-base{position:absolute;width:calc(128px*var(--btn));height:calc(128px*var(--btn));margin:calc(-64px*var(--btn)) 0 0 calc(-64px*var(--btn));border-radius:50%;
  background:radial-gradient(circle,rgba(241,231,214,.05) 0 55%,rgba(241,231,214,.1) 56%);border:2px solid rgba(241,231,214,.22);pointer-events:none;transition:opacity .15s;opacity:.55;}
.stick-base.on{opacity:1;transition:none;}
body.stick-fixed .stick-base{opacity:.85;}
.stick-knob{position:absolute;left:50%;top:50%;width:calc(56px*var(--btn));height:calc(56px*var(--btn));margin:calc(-28px*var(--btn)) 0 0 calc(-28px*var(--btn));border-radius:50%;
  background:rgba(242,163,58,.35);border:2px solid var(--amber);box-shadow:0 0 0 3px rgba(0,0,0,.25);}
.stick-base.on .stick-knob{background:rgba(242,163,58,.75);}
.btns{position:absolute;right:calc(14px + var(--sar));bottom:calc(14px + var(--sab));width:calc(258px*var(--btn));height:calc(232px*var(--btn));pointer-events:none;}
.tb{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;pointer-events:auto;touch-action:none;cursor:pointer;
  font-family:var(--display);font-size:calc(11px*var(--btn));letter-spacing:.04em;color:#fff;text-shadow:1px 1px 0 #000;
  background:rgba(20,15,26,.42);border:2px solid rgba(241,231,214,.4);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transform:translate(50%,50%);}
.tb.on{background:rgba(242,163,58,.85);border-color:#ffe2a8;color:var(--ink);text-shadow:none;transform:translate(50%,50%) scale(.93);}
.tb-atk {right:calc(52px*var(--btn));bottom:calc(52px*var(--btn));width:calc(96px*var(--btn));height:calc(96px*var(--btn));font-size:calc(13px*var(--btn));background:rgba(242,163,58,.3);border-color:rgba(242,163,58,.95);}
.tb-heavy{right:calc(146px*var(--btn));bottom:calc(40px*var(--btn));width:calc(78px*var(--btn));height:calc(78px*var(--btn));background:rgba(224,83,61,.28);border-color:rgba(255,138,106,.9);}
.tb-jump{right:calc(46px*var(--btn));bottom:calc(150px*var(--btn));width:calc(76px*var(--btn));height:calc(76px*var(--btn));background:rgba(79,179,169,.28);border-color:rgba(127,227,207,.9);}
.tb-dash{right:calc(130px*var(--btn));bottom:calc(128px*var(--btn));width:calc(62px*var(--btn));height:calc(62px*var(--btn));}
.tb-ult {right:calc(214px*var(--btn));bottom:calc(112px*var(--btn));width:calc(56px*var(--btn));height:calc(56px*var(--btn));color:var(--muted);}
.tb-ult.ready{color:var(--ink);background:rgba(232,192,106,.9);border-color:#fff1b8;text-shadow:none;animation:ready .8s steps(2) infinite;}
@keyframes ready{50%{box-shadow:0 0 0 6px rgba(232,192,106,.45);}}
.tb-pause{position:absolute;top:calc(8px + var(--sat));right:calc(8px + var(--sar));width:44px;height:44px;pointer-events:auto;font-family:var(--display);font-size:14px;
  background:rgba(20,15,26,.55);border:2px solid rgba(241,231,214,.35);border-radius:8px;color:var(--fg);cursor:pointer;}
.tb-pause:active{background:var(--amber);color:var(--ink);}
.rotate{display:none;}
@media (orientation:portrait){
  /* upright phones are narrow: ULT moves up between JUMP and DASH so the cluster stays clear of the stick */
  .btns{height:calc(256px*var(--btn));}
  .tb-ult{right:calc(100px*var(--btn));bottom:calc(212px*var(--btn));}
  body.touch-on .rotate{display:block;position:absolute;left:0;right:0;text-align:center;font-family:var(--display);font-size:12px;color:var(--muted);pointer-events:none;}
}
@media (prefers-reduced-motion:reduce){.tb-ult.ready{animation:none;box-shadow:0 0 0 4px rgba(232,192,106,.45);}.menu.open,.logo{animation:none;}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game" width="768" height="432" tabindex="0" aria-label="Steel and Dust game screen"></canvas></div>

  <div class="touch live" id="touch" aria-hidden="true">
    <div class="stick-zone" id="stickZone"><div class="stick-base" id="stickBase"><div class="stick-knob" id="stickKnob"></div></div></div>
    <div class="btns">
      <button class="tb tb-ult" data-k="ult" tabindex="-1">ULT</button>
      <button class="tb tb-dash" data-k="dash" tabindex="-1">DASH</button>
      <button class="tb tb-jump" data-k="jump" tabindex="-1">JUMP</button>
      <button class="tb tb-heavy" data-k="K" tabindex="-1">HEAVY</button>
      <button class="tb tb-atk" data-k="L" tabindex="-1">ATTACK</button>
    </div>
    <button class="tb-pause" id="pauseBtn" tabindex="-1" aria-label="Pause">II</button>
  </div>

  <div id="menus">
    <section class="menu" id="m-title" aria-label="Main menu">
      <h1 class="logo">Steel &amp; Dust<span>pixel brawler</span></h1>
      <div class="mlist">
        <button class="mbtn primary" data-act="play">Play</button>
        <button class="mbtn" data-act="help">How to play</button>
        <button class="mbtn" data-act="settings">Settings</button>
        <button class="mbtn" data-act="fullscreen" data-fs>Full screen</button>
      </div>
      <p class="mnote" id="titleNote"></p>
      <p class="rotate" id="rotateHint" style="bottom:calc(10px + var(--sab))">↻ turn your phone sideways for a bigger view</p>
    </section>

    <section class="menu" id="m-pause" aria-label="Paused">
      <h2 class="mtitle">Paused</h2>
      <div class="mlist">
        <button class="mbtn primary" data-act="resume">Resume</button>
        <button class="mbtn" data-act="help">How to play</button>
        <button class="mbtn" data-act="settings">Settings</button>
        <button class="mbtn" data-act="weapon" id="weaponBtn" hidden>Weapon: Fists</button>
        <button class="mbtn" data-act="fullscreen" data-fs>Full screen</button>
        <button class="mbtn" data-act="restart">Restart</button>
        <button class="mbtn" data-act="quit">Quit to title</button>
      </div>
    </section>

    <section class="menu" id="m-over" aria-label="Defeated">
      <h2 class="mtitle bad">You fell</h2>
      <p class="mnote" id="overNote"></p>
      <div class="mlist">
        <button class="mbtn primary" data-act="continue">Continue</button>
        <button class="mbtn" data-act="restart">Restart stage</button>
        <button class="mbtn" data-act="quit">Quit to title</button>
      </div>
    </section>

    <section class="menu" id="m-clear" aria-label="Stage clear">
      <h2 class="mtitle good">Stage clear</h2>
      <dl class="stats" id="clearStats"></dl>
      <div class="mlist">
        <button class="mbtn primary" data-act="restart">Play again</button>
        <button class="mbtn" data-act="quit">Title</button>
      </div>
    </section>

    <section class="menu sub" id="m-settings" aria-label="Settings">
      <div class="box">
        <header><h2>Settings</h2><button class="xbtn" data-act="back">Back</button></header>
        <div class="scroll" id="settingsList"></div>
      </div>
    </section>

    <section class="menu sub" id="m-help" aria-label="How to play">
      <div class="box">
        <header><h2>How to play</h2><button class="xbtn" data-act="back">Back</button></header>
        <div class="scroll">
          <div class="tabs" role="tablist" id="helpTabs"></div>
          <div id="helpBody"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
'use strict';
/* ================================================================
   STEEL & DUST — prototype
   Low-res 384x216, fixed 60 Hz simulation, data-driven moves.
   ================================================================ */
const W=384,H=216,GROUND=184,WORLD_W=2000,STEP=1000/60;
const RS=2;   // canvas pixels per game pixel: the world is drawn 2x, hero sprites at their native resolution
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-t,3);
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function hash(n){n=Math.imul(n|0,2654435761);n^=n>>>13;n=Math.imul(n,1274126177);n^=n>>>16;return n>>>0;}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------------- settings (saved in localStorage) ---------------- */
const COARSE=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const SET_DEF={music:60,sfx:80,shake:2,numbers:true,haptics:true,flash:true,touch:'auto',btn:1,stick:'fixed',aim:COARSE,autoAtk:true,difficulty:1,training:false,hitboxes:false};
const S=Object.assign({},SET_DEF);
try{Object.assign(S,JSON.parse(localStorage.getItem('sd_settings')||'{}'));}catch(e){}
function saveSettings(){try{localStorage.setItem('sd_settings',JSON.stringify(S));}catch(e){}}
// difficulty: enemy damage, how many raiders may attack at once, and how long they wait between attacks
const DIFF=[{name:'Easy',dmg:0.6,tokens:1,cool:1.45,heal:45},{name:'Normal',dmg:1,tokens:2,cool:1,heal:35},{name:'Hard',dmg:1.35,tokens:3,cool:0.75,heal:25}];
const diff=()=>DIFF[S.difficulty]||DIFF[1];

/* ---------------- 3x5 bitmap font ---------------- */
const FONT={A:[2,5,7,5,5],B:[6,5,6,5,6],C:[3,4,4,4,3],D:[6,5,5,5,6],E:[7,4,6,4,7],F:[7,4,6,4,4],G:[3,4,5,5,3],H:[5,5,7,5,5],
I:[7,2,2,2,7],J:[1,1,1,5,2],K:[5,5,6,5,5],L:[4,4,4,4,7],M:[5,7,7,5,5],N:[6,5,5,5,5],O:[2,5,5,5,2],P:[6,5,6,4,4],Q:[2,5,5,6,3],
R:[6,5,6,5,5],S:[3,4,2,1,6],T:[7,2,2,2,2],U:[5,5,5,5,7],V:[5,5,5,5,2],W:[5,5,7,7,5],X:[5,5,2,5,5],Y:[5,5,2,2,2],Z:[7,1,2,4,7],
'0':[7,5,5,5,7],'1':[2,6,2,2,7],'2':[6,1,2,4,7],'3':[6,1,2,1,6],'4':[5,5,7,1,1],'5':[7,4,6,1,6],'6':[3,4,7,5,7],'7':[7,1,2,2,2],
'8':[7,5,7,5,7],'9':[7,5,7,1,6],'!':[2,2,2,0,2],'.':[0,0,0,0,2],',':[0,0,0,2,4],':':[0,2,0,2,0],'-':[0,0,7,0,0],'+':[0,2,7,2,0],
'/':[1,1,2,4,4],'?':[6,1,2,0,2],'>':[4,2,1,2,4],'<':[1,2,4,2,1],'%':[5,1,2,4,5],' ':[0,0,0,0,0],"'":[2,2,0,0,0],'&':[2,5,2,5,3],
'(':[1,2,2,2,1],')':[4,2,2,2,4],'^':[2,5,0,0,0]};
function textW(s,sc){return s.length*4*sc-sc;}
function drawStr(s,x,y,col,sc){ctx.fillStyle=col;for(let i=0;i<s.length;i++){const g=FONT[s[i]]||FONT['?'];for(let r=0;r<5;r++){const row=g[r];if(!row)continue;for(let c=0;c<3;c++)if(row&(4>>c))ctx.fillRect(x+(i*4+c)*sc,y+r*sc,sc,sc);}}}
function text(s,x,y,col,sc,align,shadow){
  sc=sc||1;s=String(s).toUpperCase();const w=textW(s,sc);
  if(align==='center')x-=Math.floor(w/2);else if(align==='right')x-=w;

  const set=bankGet(k);if(!set)return;const d=SND[k],grp=d[0],pri=d[4],t=at(0.008);
  if(!offline){
    const now=AC.currentTime;for(let i=VOICES.length-1;i>=0;i--)if(VOICES[i].end<now)VOICES.splice(i,1);
    if(grp!=='v'&&VOICES.some(v=>v.k===k&&Math.abs(v.t-t)<0.035))return;   // the same sound twice at once is one sound (multi-hits, a swing through a crowd)
    const low=list=>list.reduce((a,b)=>b.pri<a.pri||(b.pri===a.pri&&b.t<a.t)?b:a);   // lowest priority, then oldest
    const same=VOICES.filter(v=>v.grp===grp);
    if(same.length>=CAP[grp]){const w=low(same);if(w.pri>pri)return;stopV(w);}
    if(VOICES.length>=MAXV){const w=low(VOICES);if(w.pri>pri)return;stopV(w);}
  }
  let i=Math.floor(Math.random()*set.length);                       // a different take from the last one, and from any copy still playing
  for(let n=0;n<set.length&&set.length>1&&(i===LAST[k]||VOICES.some(v=>v.k===k&&v.i===i));n++)i=(i+1)%set.length;
  if(o.take!==undefined)i=o.take%set.length;
  LAST[k]=i;
  const src=AC.createBufferSource(),g=AC.createGain(),rate=(o.rate||1)*vary(0.035);src.buffer=set[i];src.playbackRate.value=rate;g.gain.value=d[1]*(o.vol||1);
  src.connect(g);let out=g;
  if(o.x!==undefined&&AC.createStereoPanner){                       // heard where it happens on screen; swings and dashes travel the way they go
    const pn=AC.createStereoPanner(),c=clamp((o.x-camX)/W*2-1,-1,1)*0.55;
    if(o.dir){pn.pan.setValueAtTime(clamp(c-o.dir*0.25,-1,1),t);pn.pan.linearRampToValueAtTime(clamp(c+o.dir*0.25,-1,1),t+set[i].duration/rate*0.8);}
    else pn.pan.value=c;
    g.connect(pn);out=pn;}
  out.connect(sfxBus);src.start(t);
  if(!offline)VOICES.push({src,g,k,i,grp,pri,t,end:t+set[i].duration/src.playbackRate.value});
}

/* ---------------- music: a small step sequencer, all synthesized ----------------
   Each song is four bars of 16 steps over a chord progression (MIDI notes): filtered saw bass, a soft pad,
   an echoing arpeggio, a lead on alternate bars, and kick / snare / hats. */
const SONGS={
  title:{bpm:84,prog:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],bass:[0,8],arp:[0,2,1,2],arpEvery:2,kick:[],snare:[],hat:[],pad:1,
    lead:[69,0,0,0,67,0,64,0,65,0,0,0,64,0,62,0],leadType:'triangle'},
  battle:{bpm:128,prog:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],bass:[0,3,6,8,11,14],arp:[0,1,2,1],arpEvery:1,kick:[0,8,10],snare:[4,12],hat:[2,6,10,14],pad:0.6,
    lead:[76,0,74,0,72,0,0,74,0,72,69,0,0,0,67,0],leadType:'sawtooth'},
  boss:{bpm:144,prog:[[57,60,64],[58,62,65],[57,60,64],[55,59,62]],bass:[0,2,3,6,8,10,11,14],arp:[0,2,1,2],arpEvery:1,kick:[0,4,8,10,12],snare:[4,12],hat:[2,6,10,14],pad:0.6,
    lead:[81,0,80,0,81,0,76,0,0,0,77,0,76,0,74,0],leadType:'sawtooth'},
};
const MUS={name:null,step:0,next:0};
const mf=n=>440*Math.pow(2,(n-69)/12);
function musicStep(name,i,t){
  const song=SONGS[name],dt=60/song.bpm/4,M=musicBus,s=i&15,ch=song.prog[(i>>4)&3],title=name==='title';
  if(song.bass.includes(s)){const f=mf(ch[0]-24);const g=amp(M,t,0.01,0.3,dt*1.6);const lp=filt('lowpass',900,220,3,t,dt*1.2,g);osc('sawtooth',f,f,t,dt*1.8,lp);osc('triangle',f/2,f/2,t,dt*1.8,amp(M,t,0.01,0.16,dt*1.5));}
  if(s%song.arpEvery===0){const n=ch[song.arp[(s/song.arpEvery|0)%song.arp.length]]+12,f=mf(n),g=amp(M,t,0.004,0.06,dt*0.9);g.connect(echoIn);osc(title?'triangle':'square',f,f,t,dt,filt('lowpass',2200,1400,0.7,t,dt,g));}
  if(song.pad&&s===0)for(const n of ch){const f=mf(n),g=amp(M,t,0.35,0.028*song.pad,dt*6,dt*9);const lp=filt('lowpass',1100,700,0.7,t,dt*16,g);osc('sawtooth',f,f,t,dt*16,lp);osc('sawtooth',f*1.007,f*1.007,t,dt*16,lp);}
  const ln=song.lead[s];
  if(ln&&((i>>4)&1)){const f=mf(ln),len=dt*(title?3.5:1.7),g=amp(M,t,0.01,title?0.1:0.07,len);g.connect(echoIn);
    const o=osc(song.leadType,f,f,t,len,filt('lowpass',title?3000:2000,1500,0.8,t,len,g));const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=5.5;lg.gain.value=f*0.006;lfo.connect(lg);lg.connect(o.frequency);lfo.start(t);lfo.stop(t+len+0.05);}
  if(song.kick.includes(s)){osc('sine',150,46,t,0.16,amp(M,t,0.002,0.62,0.15),0.09);noiseSrc(t,0.01,filt('highpass',2500,2500,0.7,t,0.01,amp(M,t,0.0005,0.12,0.008)));}
  if(song.snare.includes(s)){noiseSrc(t,0.14,filt('bandpass',1900,1500,0.8,t,0.14,amp(M,t,0.002,0.22,0.12)));osc('triangle',200,160,t,0.07,amp(M,t,0.002,0.12,0.07));}
  const openHat=song.hat.includes(s);
  if(openHat||!title&&s%2===0)noiseSrc(t,0.04,filt('highpass',8500,8500,0.7,t,0.04,amp(M,t,0.001,openHat?0.05:0.025,openHat?0.06:0.02)));
}
function musicTick(){
  if(!AC||offline||AC.state!=='running'||!MUS.name)return;
  const dt=60/SONGS[MUS.name].bpm/4;
  if(MUS.next<AC.currentTime)MUS.next=AC.currentTime+0.05;
  while(MUS.next<AC.currentTime+0.22){            // a little lookahead, so a slow frame does not stall the music
    try{musicStep(MUS.name,MUS.step,MUS.next);}catch(e){}
    MUS.step=(MUS.step+1)%64;MUS.next+=dt;
  }
}
function playMusic(name){if(MUS.name===name)return;MUS.name=name;MUS.step=0;MUS.next=AC?AC.currentTime+0.08:0;}
// renders sounds into a buffer without a speaker, for checking levels in tests: fn(at) schedules the sounds
async function renderAudio(secs,fn){
  const saved=[AC,master,sfxBus,sfxOut,musicBus,echoIn,NB,CRUNCH];
  try{AC=new OfflineAudioContext(2,Math.ceil(44100*secs),44100);buildAudio(AC);master.gain.value=0.9;sfxBus.gain.value=0.75;musicBus.gain.value=0.5;
    offline=2;fn();offline=1;const buf=await AC.startRendering();return [buf.getChannelData(0),buf.getChannelData(1)];}
  finally{[AC,master,sfxBus,sfxOut,musicBus,echoIn,NB,CRUNCH]=saved;offline=0;}
}

const PAD={prev:{},dir:{left:false,right:false,up:false,down:false},nav:0,navT:0,on:false};
function pollPad(){
  const pads=navigator.getGamepads?navigator.getGamepads():null;if(!pads)return;
  let gp=null;for(const p of pads)if(p&&p.connected&&p.mapping==='standard'){gp=p;break;}
  if(!gp){if(PAD.on){PAD.on=false;for(const k in PAD.dir)if(PAD.dir[k]){PAD.dir[k]=false;held[k]=false;}}return;}
  PAD.on=true;
  const btn=i=>!!(gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>0.5));
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0;
  const dir={left:btn(14)||ax<-0.45,right:btn(15)||ax>0.45,up:btn(12)||ay<-0.6,down:btn(13)||ay>0.6};
  const edge={};for(const i of [0,1,2,3,5,7,9,8])edge[i]=btn(i)&&!PAD.prev[i];
  if(Object.values(edge).some(Boolean)||Object.values(dir).some(Boolean))hooks.input('pad');
  if(hooks.menuOpen()){
    const v=dir.up?-1:dir.down?1:0,h=dir.left?-1:dir.right?1:0,nv=v||h*10;
    if(nv&&(nv!==PAD.nav||tickN>=PAD.navT)){hooks.menuNav(v?'move':'adjust',v||h);PAD.navT=tickN+(nv===PAD.nav?7:18);}
    PAD.nav=nv;
    if(edge[0])hooks.menuNav('ok');if(edge[1]||edge[8])hooks.menuNav('back');if(edge[9])hooks.menuNav('start');
    for(const k in PAD.dir)if(PAD.dir[k]){PAD.dir[k]=false;held[k]=false;}
  }else{
    for(const k in dir)if(dir[k]!==PAD.dir[k]){PAD.dir[k]=dir[k];held[k]=dir[k];if(dir[k]&&k!=='up')pressed[k]=true;}
    const map={0:'jump',2:'L',3:'K',1:'dash',5:'ult',7:'ult'};
    for(const i in map){if(edge[i])pressed[map[i]]=true;if(btn(+i))held[map[i]]=true;else if(PAD.prev[i])held[map[i]]=false;}
    if(edge[9])pressed.pause=true;
  }
  for(const i of [0,1,2,3,5,7,9,8])PAD.prev[i]=btn(i);
}
let upT=-99,downT=-99,upWas=false,downWas=false;   // when up / down was last pushed: ↑+J and ↓+J inside a string need a fresh push
function setBuf(b){buf.b=b;buf.t=8;buf.up=!!held.up;buf.down=!!held.down;buf.dir=0;buf.upNew=tickN-upT<=10;buf.downNew=tickN-downT<=10;}
function readInput(){
  if(held.up&&!upWas)upT=tickN;if(held.down&&!downWas)downT=tickN;upWas=!!held.up;downWas=!!held.down;
  // later presses win, so up+K pressed together is a launcher, not a jump
  if(pressed.up||pressed.jump)setBuf('jump');
  if(pressed.dash)setBuf('dash');
  for(const d of [-1,1])if(pressed[d<0?'left':'right']){
    if(tap.dir===d&&tickN-tap.t<=TAP2){setBuf('dash');buf.dir=d;tap.t=-99;}
    else{tap.dir=d;tap.t=tickN;}
  }
  for(const b of ['L','K','ult'])if(pressed[b])setBuf(b);
}
function useBuf(){buf.b=null;buf.t=0;}

function autoFace(p){

const ULT_SPR=[['slash1',2],['slash2',3],['spin_slash',3],['thrust',3]];

function ultTargets(){return F.filter(e=>e.side==='e'&&e.state!=='ko'&&!e.rm&&!e.entering&&e.x>camX-8&&e.x<camX+W+8);}
function startUlt(p){

function ultUpdate(p){
  const t=++p.st,s0=ULT.intro,s1=s0+ULT.gap*ULT.strikes,b=bounds(p);
  if(t>=s0&&t<s1&&(t-s0)%ULT.gap===0){                     // teleport to the next raider and cut
    const k=(t-s0)/ULT.gap,list=ultTargets();
    p.ultSpr=ULT_SPR[k%ULT_SPR.length];
    if(list.length){
      const tg=list[k%list.length],side=k%2?1:-1;
      p.ghosts.push({x:p.x,y:p.y,f:p.f,spr:p.ultSpr,c:'#ffd36b',l:14});
      p.x=clamp(tg.x+side*16*tg.S,b[0],b[1]);p.y=tg.y;p.air=p.y<GROUND;p.vx=0;p.vy=0;p.f=tg.x>=p.x?1:-1;
      sfx('warp');applyHit(p,tg,ULT.hit,tg.x-p.f*4,tg.y-18*tg.S);
    }else sparks(p.x+p.f*14,p.y-22,6,'#ffd36b',2.4);
  }
  if(t===s1){                                              // back to the middle of the screen for the finale
    p.ghosts.push({x:p.x,y:p.y,f:p.f,spr:p.ultSpr,c:'#ffd36b',l:14});
    p.x=clamp(camX+W/2,b[0],b[1]);p.y=GROUND;p.air=false;p.vx=0;p.vy=0;sfx('warp');
  }
  if(t>=s1){
    const k=t-s1,fa=ULT.finAt;
    p.ultSpr=['cleave',k<fa?Math.min(2,Math.floor(k*3/fa)):Math.min(7,3+Math.floor((k-fa)*5/(ULT.fin-fa)))];
    if(k===fa){
      flashT=10;bandT=16;shake(6,24);sfx('ultEnd');slowT=Math.max(slowT,36);
      const f0=p.f;for(const tg of ultTargets()){p.f=tg.x>=p.x?1:-1;applyHit(p,tg,ULT.end,tg.x,tg.y-18*tg.S);}p.f=f0;
    }

  }
}

/* ---------------- pose & rig ---------------- */
function getPose(e){
  const G=Object.assign({},BASE,guardOf(e));
  switch(e.state){
    case 'idle':{const b=(e.anim>>5)&1;G.crouch+=b;G.a1+=b*0.05;return G;}
    case 'walk':{const ph=e.anim*0.21*(e.walkDir||1),s=Math.sin(ph),c=Math.cos(ph);
      G.ff=1+6*s;G.bf=1-6*s;G.fl=Math.max(0,3*c);G.bl=Math.max(0,-3*c);G.b1+=0.6*s;G.b2+=0.3*s;G.crouch+=Math.abs(s)>0.7?0:1;return G;}
    case 'air':
      if(e.vy<0)Object.assign(G,{ff:5,fl:7,bf:-3,bl:3,b1:-0.8,b2:-1.2});else Object.assign(G,{ff:4,fl:3,bf:-5,bl:6,b1:-0.4,b2:-0.6});
      G.crouch-=1;return G;
    case 'attack':return attackPose(e,G);
    case 'hurt':return Object.assign(G,HURT);
    case 'juggle':{Object.assign(G,JUG);G.torsoA=-2.3-clamp(e.vy*0.15,-1,1);return G;}
    case 'ko':if(e.air){Object.assign(G,JUG);G.torsoA=-2.3-clamp(e.vy*0.15,-1,1);return G;}return Object.assign(G,LIE);
    case 'down':return Object.assign(G,LIE);
    case 'getup':return mix(Object.assign({},G,LIE),Object.assign({},G,{crouch:4}),easeIO(Math.min(1,e.st/16)));
    case 'dash':return Object.assign(G,{crouch:6,torsoA:-0.75,ff:6,fl:2,bf:-8,bl:3,a1:1.9,a2:2.6,b1:2.2,b2:2.8,wa:2.6});
    case 'win':return Object.assign(G,{a1:-1.5,a2:-1.7,wa:-1.6,b1:-1.3,b2:-1.6,crouch:(e.anim>>4)&1});
  }
  return G;
}
function attackPose(e,G){
  const m=e.move,t=e.mt;const Wp=Object.assign({},G,m.W),Sp=Object.assign({},G,m.S);const from=e.pose0||G;
  if(t<m.su)return mix(from,Wp,easeOut(Math.min(1,(t+1)/Math.max(1,m.su*0.7))));   // anticipation, then hold
  if(t<m.su+m.ac){                                                                      // snap to the strike in 1-2 frames
    const k=Math.min(1,(t-m.su+1)/Math.min(2,m.ac));const p=mix(Wp,Sp,easeOut(k));
    if(m.S.spin){const r=(t-m.su)*m.S.spin;p.a1+=r;p.a2+=r;p.wa+=r;}
    if(m.sustain){const s=Math.sin(e.anim*0.5)*4;p.ff+=s;p.bf-=s;}
    return p;
  }
  const r=(t-m.su-m.ac)/m.re;                                                            // follow-through, then settle
  const base=e.air?Object.assign({},G,{ff:4,fl:4,bf:-4,bl:5}):G;
  let last=Sp;
  if(m.S.spin){last=Object.assign({},Sp);const rr=((m.ac-1)*m.S.spin)%(Math.PI*2);last.a1+=rr;last.a2+=rr;last.wa+=rr;}
  return mix(last,base,r<0.3?0:easeIO((r-0.3)/0.7));
}
function knee(h,ft,f,S){
  const dx=ft.x-h.x,dy=ft.y-h.y,d=Math.hypot(dx,dy)||1,L=8*S,mx=(h.x+ft.x)/2,my=(h.y+ft.y)/2;
  if(d>=2*L)return {x:mx,y:my};

  if(qx*f-qy*0.5<-qx*f+qy*0.5){qx=-qx;qy=-qy;}
  return {x:mx+qx*off,y:my+qy*off};
}
function footAt(h,x,y,S){const dx=x-h.x,dy=y-h.y,d=Math.hypot(dx,dy),L=16*S;if(d<=L)return {x,y};return {x:h.x+dx/d*L,y:h.y+dy/d*L};}
function rig(x,y,f,S,P){
  const hip={x,y:y+(-15+P.crouch)*S};

  const head={x:neck.x+tx*4.5*S*f,y:neck.y+ty*4.5*S};
  const sh={x:hip.x+tx*9*S*f,y:hip.y+ty*9*S};
  const seg=(o,a,l)=>({x:o.x+Math.cos(a)*l*S*f,y:o.y+Math.sin(a)*l*S});

function weaponLine(e,J,P){

    case 'axe':return {type:id,a:at(-2),b:at(13),dx,dy};
    case 'knife':return {type:id,a:at(-1),b:at(6),dx,dy};
    case 'shield':return {type:id,a:h,b:h,dx,dy};
    case 'hammer':return {type:id,a:at(-3),b:at(16),dx,dy};
  }
  return null;
}
function tipPoints(e){
  const m=e.move,J=e.J;
  if(m.tip==='foot')return {t:J.ffoot,i:{x:(J.hip.x+J.ffoot.x)/2,y:(J.hip.y+J.ffoot.y)/2}};
  const w=weaponLine(e,J,e.pose);
  if(w)return {t:w.b,i:{x:J.fh.x*0.55+w.b.x*0.45,y:J.fh.y*0.55+w.b.y*0.45}};
  return {t:J.fh,i:J.fe};
}
function refreshPose(e){e.pose=getPose(e);e.J=rig(e.x,e.y,e.f,e.S,e.pose);}

/* scarf: a tiny verlet rope = free secondary motion */
function initScarf(e){e.scarf=[];for(let i=0;i<7;i++)e.scarf.push({x:e.x,y:e.y-26,px:e.x,py:e.y-26});}
function updScarf(e){
  const J=e.J,sc=e.scarf,ax=J.neck.x-e.f*2*e.S,ay=J.neck.y+2;
  sc[0].x=sc[0].px=ax;sc[0].y=sc[0].py=ay;
  for(let i=1;i<sc.length;i++){const p=sc[i];const vx=(p.x-p.px)*0.86,vy=(p.y-p.py)*0.86;p.px=p.x;p.py=p.y;
    p.x+=vx-e.f*0.16+Math.sin(tickN*0.15+i)*0.07;p.y+=vy+0.14;}
  for(let k=0;k<2;k++)for(let i=1;i<sc.length;i++){const a=sc[i-1],b=sc[i];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,r=(d-3)/d;b.x-=dx*r;b.y-=dy*r;}
}

/* ---------------- brains ---------------- */
function pickAir(b,cur){
  if(b.b==='K'&&(b.down||held.down)&&!(cur&&cur.dive))return 'ADK';
  if(b.b==='L'&&(b.down||held.down))return 'ADL';                              // ↓ + J in the air: pogo
  if(cur)return cur.next[b.b]||null;
  return b.b==='K'?'AK':'AL';
}
function pickGround(b,cur){
  if(b.b==='K'&&(b.up||b.down||held.up||held.down)&&!(cur&&cur.launch))return 'UK';
  if(b.b==='L'&&(b.down||held.down)&&(!cur||b.downNew)&&!(cur&&cur.id==='DL'))return 'DL';   // ↓ + J: low sweep
  if(b.b==='L'&&(b.up||held.up)&&(!cur||b.upNew)&&!(cur&&cur.id==='UL'))return 'UL';         // ↑ + J: rising strike
  if(cur)return cur.next[b.b]||null;
  return b.b==='K'?'K1':'L1';
}
function thinkPlayer(p){
  const dir=(held.right?1:0)-(held.left?1:0);
  if(mode!=='play'||clearT>0){
    if(p.state==='charge'||p.state==='squat')p.state='idle';
    if(p.state==='idle'||p.state==='walk'){p.vx*=0.6;p.state=clearT>0?'win':'idle';}
    return;
  }
  const b=buf.b?buf:null;
  if(b&&b.b==='ult'){
    useBuf();
    if(meter>=100&&ULT_FROM.has(p.state)){startUlt(p);return;}
    if(meter<100)floatText(p.x,p.y-48,'ULT not ready','#a397ae');
  }
  switch(p.state){
    case 'idle':case 'walk':
      if(b){
        if(b.b==='jump'){startSquat(p,dir);useBuf();return;}
        if(b.b==='dash'){doDash(p,b.dir||dir||p.f);useBuf();return;}
        if(b.b==='K'&&!(b.up||b.down||held.up||held.down)){if(dir)p.f=dir;else autoFace(p);startCharge(p);useBuf();return;}
        const id=pickGround(b,null);if(id){if(dir)p.f=dir;else autoFace(p);startMove(p,id);useBuf();return;}
      }
      if(dir){p.f=dir;p.vx=dir*1.55;p.state='walk';p.walkDir=1;}else{p.vx*=0.6;p.state='idle';}
      break;
    case 'squat':
      if(dir)p.jdir=dir;
      if(b&&b.b==='K'){if(dir)p.f=dir;startMove(p,'UK');useBuf();return;}   // up and K together: launcher
      if(b&&b.b==='L'){if(dir)p.f=dir;startMove(p,'UL');useBuf();return;}   // up and J together: rising strike
      break;
    case 'charge':                                        // K is held; letting go picks the move by how long
      if(dir)p.f=dir;
      if(p.st<=4&&(held.up||held.down)){startMove(p,'UK');return;}
      if(b&&b.b==='L'){if(!dir)autoFace(p);startMove(p,'L1');useBuf();return;}
      if(b&&b.b==='jump'){startSquat(p,dir);useBuf();return;}
      if(b&&b.b==='dash'){doDash(p,b.dir||dir||p.f);useBuf();return;}
      if(!held.K){if(!dir)autoFace(p);startMove(p,p.st>=CH2?'C2':p.st>=CH1?'C1':'K1');return;}
      break;
    case 'air':
      if(dir)p.vx=clamp(p.vx+dir*0.15,-1.9,1.9);
      if(b&&b.b==='dash'&&!p.airDash){doDash(p,b.dir||dir||p.f);useBuf();return;}
      if(b&&(b.b==='L'||b.b==='K')){const id=pickAir(b,null);if(id){if(dir)p.f=dir;else autoFace(p);startMove(p,id);useBuf();}}
      break;
    case 'dash':{                                         // dash attacks, turning around, dashing again
      if(b&&b.b==='dash'&&!p.air&&p.st>=4&&(p.dashN||0)<2){                    // a new dash the other way starts at once; the same way, late in the dash
        const d=b.dir||dir||p.f;if(d!==p.f||p.st>=10){doDash(p,d);useBuf();return;}}
      if(dir&&dir!==p.f&&p.st>=5&&!(b&&(b.b==='L'||b.b==='K'||b.b==='dash'))){   // the other way held: brake and turn
        p.f=dir;dust(p.x,GROUND,3);
        if(p.air){p.state='air';p.vx=dir*0.6;}else{p.state='walk';p.walkDir=1;p.vx=dir*0.9;}
        return;}
      if(!b||p.st<2)break;
      if(b.b==='L'||b.b==='K'){if(dir)p.f=dir;startMove(p,b.b==='L'?(p.air?'AL':'DA'):(p.air?pickAir(b,null):'UK'));useBuf();return;}   // attacks go the way you hold
      if(b.b==='jump'&&!p.air){doJump(p,-5.8,p.f*2.2);useBuf();return;}
      break;}
    case 'attack':{
      const m=p.move;
      if(p.air&&dir&&!m.dive)p.vx=clamp(p.vx+dir*0.08,-1.9,1.9);
      // a launcher that connects jumps after the enemy while up is held (or pressed)
      if(m.jc&&p.hitConfirm&&p.mt>=m.su+m.ac&&(held.up||(b&&b.b==='jump'))){doJump(p,-6.6);if(b&&b.b==='jump')useBuf();return;}
      if(!b)break;
      if((b.b==='L'||b.b==='K')&&p.mt>=m.cw[0]&&p.mt<=m.cw[1]){
        const id=p.air?pickAir(b,m):pickGround(b,m);
        if(id){if(!p.air&&dir)p.f=dir;else if(!p.air)autoFace(p);startMove(p,id);useBuf();return;}
        if(!p.air&&b.b==='K'&&!m.charge){if(dir)p.f=dir;startCharge(p);useBuf();return;}   // no K follow-up: charge out of the string
      }
      if(b.b==='dash'&&!m.dive&&!(p.air&&p.airDash)&&p.mt>=m.su+m.ac+(p.hitConfirm?0:5)){doDash(p,b.dir||dir);useBuf();}   // dash out of recovery (sooner on a hit)
      break;}
  }
}
function thinkEnemy(e){
  if(e.state!=='idle'&&e.state!=='walk')return;
  const p=player,dx=p.x-e.x,dist=Math.abs(dx),T=e.T;
  if(e.entering){const mid=lock?(lock.l+lock.r)/2:camX+W/2;e.f=mid>=e.x?1:-1;e.vx=e.f*T.spd;e.state='walk';e.walkDir=1;return;}   // walk in toward the arena center
  e.f=dx>=0?1:-1;
  if(e.ai.cool>0)e.ai.cool--;
  if(p.state==='ko'||mode!=='play'||clearT>0){e.vx*=0.6;e.state='idle';return;}
  if(T.boss){bossThink(e,dist);return;}
  const pDown=p.state==='down'||p.state==='getup';
  if(!e.token&&e.ai.cool<=0&&!pDown&&Math.random()<0.03)takeToken(e);
  if(T.ranged){                                         // slinger: hold the middle distance and throw
    if(e.token&&e.ai.cool<=0&&!pDown&&dist>30&&dist<150&&Math.abs(p.y-e.y)<50){startMove(e,'toss');return;}
    const b=bounds(e),cornered=e.x<=b[0]+2||e.x>=b[1]-2;
    if(dist<64&&!cornered){e.vx=-e.f*T.spd;e.state='walk';e.walkDir=-1;}
    else if(dist>125){e.vx=e.f*T.spd;e.state='walk';e.walkDir=1;}
    else{e.vx*=0.6;e.state='idle';}
    return;
  }
  if(e.token&&e.ai.cool<=0&&!pDown&&!p.air){
    if(dist<=T.range+4){startMove(e,T.move||(T.weapon==='knife'?'stab':'punch'));return;}
    if(T.lunge&&dist>40&&dist<72&&Math.random()<0.04){startMove(e,'lunge');return;}
  }
  const want=e.token?T.range-4:e.ai.space;
  if(dist>want+6){e.vx=e.f*T.spd;e.state='walk';e.walkDir=1;}
  else if(dist<want-6){e.vx=-e.f*T.spd*0.7;e.state='walk';e.walkDir=-1;}
  else{e.vx*=0.6;e.state='idle';if(Math.random()<0.01)e.ai.space=40+Math.random()*44;}
}
function bossThink(e,dist){
  if(e.ai.cool>0){if(dist>42){e.vx=e.f*e.T.spd;e.state='walk';e.walkDir=1;}else{e.vx*=0.6;e.state='idle';}return;}
  if(player.state==='down'||player.state==='getup'){e.vx*=0.6;e.state='idle';return;}
  if(dist<46)startMove(e,Math.random()<0.55?'swipe':'slam');
  else if(dist>90&&Math.random()<0.05)startMove(e,'charge');
  else{e.vx=e.f*e.T.spd;e.state='walk';e.walkDir=1;if(dist<70&&Math.random()<0.02)startMove(e,'slam');}
}

/* ---------------- per-tick fighter update ---------------- */
function updateFighter(e){
  if(e.hitstop>0){e.hitstop--;return;}         // frozen: logic and pose both pause
  e.shakeHit=0;e.anim++;
  if(e.flash>0)e.flash--;if(e.armorT>0)e.armorT--;if(e.blockT>0)e.blockT--;if(e.iframes>0)e.iframes--;if(e.hpShow>0)e.hpShow--;
  if(e.side==='p')thinkPlayer(e);else thinkEnemy(e);
  stateUpdate(e);
  physics(e);
  refreshPose(e);
  if(e.state==='attack'&&e.move&&e.mt>=e.move.su-1&&e.mt<=e.move.su+e.move.ac+1){
    const tp=tipPoints(e);e.trail.push({tx:tp.t.x,ty:tp.t.y,ix:tp.i.x,iy:tp.i.y});if(e.trail.length>6)e.trail.shift();
  }else if(e.trail.length)e.trail.shift();
  if((e.state==='dash'&&e.st%4===1&&e.st<14)||(e.state==='attack'&&e.move&&e.move.ghost&&e.act&&e.anim%3===0))   // a few spaced echoes, not one per tick
    e.ghosts.push({x:e.x,y:e.y,J:e.J,f:e.f,pose:e.pose,spr:heroSprite(e)?heroAnim(e):null,row:heroRow(e),l:12});
  if(e.state==='dash'&&e.st<12&&e.st%2===0)parts.push({k:'streak',x:e.x-e.f*rnd(4,10),y:e.y-rnd(6,30),vx:-e.f*rnd(1.2,2.2),vy:0,l:10,m:10,len:rnd(5,10)|0});   // wind lines behind a dash
  if(e.state==='walk'&&!e.entering&&e.anim%14===0)dust(e.x-e.f*5,GROUND,1);   // footstep puffs
  for(const g of e.ghosts)g.l--;e.ghosts=e.ghosts.filter(g=>g.l>0);
  if(e.scarf)updScarf(e);
  if(e.hpLag>e.hp)e.hpLag=Math.max(e.hp,e.hpLag-0.5);else e.hpLag=e.hp;
}
function stateUpdate(e){
  switch(e.state){
    case 'attack':{
      const m=e.move,t=e.mt;
      if(t===Math.max(0,m.su-swingLead(e,m)))swingSfx(e,m);
      if(t===m.su){
        if(m.fwd&&!m.sustain)e.vx=e.f*m.fwd*(e.air?0.4:1);
        if(m.shock&&!m.dive)spawnShock(e);
        if(e.side==='e'&&e.T.boss&&m.id==='slam')shake(2,6);
        if(m.charge){sfx('release');shake(m.charge,6);}
        if(m.wave)spawnWave(e,m);
        if(m.toss)tossKnife(e);
        if(m.quake)quake(e,m);
        if(m.stomp&&e.air)e.vy=Math.max(e.vy,m.stomp);                       // drop onto them
      }
      const active=t>=m.su&&t<m.su+m.ac;
      if(active){
        if(m.dive){e.vx=e.f*m.dive[0];e.vy=m.dive[1];e.air=true;}
        if(m.sustain){e.vx=e.f*m.fwd;const b=bounds(e);
          if((e.f>0&&e.x>=b[1]-1)||(e.f<0&&e.x<=b[0]+1)){e.mt=m.su+m.ac-1;shake(2,8);dust(e.x+e.f*10,GROUND,6);sfx('heavy');}}
        if(m.multi&&(t-m.su)%m.multi===0)e.hitIds.clear();
        if(m.multi&&t>m.su&&(t-m.su)%(m.multi*2)===0)swingSfx(e,m);   // a spinning move keeps whooshing
        if(m.pull)pullIn(e);
      }
      e.act=active;e.mt++;
      if(e.mt>=m.su+m.ac+m.re)endMove(e);
      break;}
    case 'hurt':if(--e.st<=0)e.state='idle';break;
    case 'down':e.st++;if(e.st>=(e.side==='p'?34:44)){e.state='getup';e.st=0;}break;
    case 'getup':e.st++;if(e.st>=16){e.state='idle';e.juggle=0;e.gbUsed=false;e.wb=false;
      if(e.side==='p')e.iframes=50;else e.ai.cool=Math.max(e.ai.cool,30);}break;
    case 'ko':if(!e.air){e.st++;if(e.side==='e'&&e.st>70)e.rm=true;if(e.side==='p'&&e.st>80&&mode==='play'){mode='over';commitScore();}}break;
    case 'dash':{e.st++;const k=1-Math.min(1,e.st/DASH_T);e.vx=e.f*(1.7+3.2*k*k);if(e.air&&e.st<12)e.vy=0;if(e.st>=DASH_T)e.state=e.air?'air':'idle';break;}
    case 'squat':if(++e.st>=3)doJump(e,-5.8,e.jdir*1.7);break;
    case 'charge':{
      e.st++;
      if(e.st===CH1){sfx('charge1');sparks(e.x,e.y-20,8,'#3cc8ff',2.4);}
      if(e.st===CH2){sfx('charge2');sparks(e.x,e.y-20,14,'#ffd36b',3.2);shake(1,4);}
      if(e.st>=CH0&&e.st%3===0)parts.push({k:'mote',x:e.x+rnd(-10,10),y:e.y-rnd(0,8),vx:0,vy:-rnd(0.6,1.4),l:22,m:22,
        c:e.st>=CH2?'#ffd36b':e.st>=CH1?'#3cc8ff':'#1f86c8'});
      break;}
    case 'ult':ultUpdate(e);break;
  }
  if(e.state!=='attack')e.act=false;
}
function physics(e){
  if(e.state==='ult')return;                     // the ultimate places the hero itself
  if(!e.air&&e.y<GROUND-0.5){e.air=true;if(e.state==='idle'||e.state==='walk')e.state='air';}   // anything left above the ground falls
  if(e.air){const g=(e.state==='juggle'||e.state==='ko')?0.26:0.3;e.vy=Math.min(7,e.vy+g);if(e.state==='juggle')e.vx*=0.985;}
  e.x+=e.vx;e.y+=e.vy;
  if(!e.air&&e.state!=='walk'&&e.state!=='dash'&&!(e.state==='attack'&&e.move&&e.move.sustain&&e.act)){e.vx*=0.8;if(Math.abs(e.vx)<0.05)e.vx=0;}
  if(e.y>=GROUND){e.y=GROUND;e.vy=0;if(e.air){e.air=false;e.airDash=false;e.pogoN=0;land(e);}}
  const b=bounds(e);
  if(e.x<b[0]){wallHit(e,-1);e.x=b[0];}else if(e.x>b[1]){wallHit(e,1);e.x=b[1];}
}
function wallHit(e,dir){
  if(e.state==='juggle'&&Math.abs(e.vx)>2.4&&!e.wb){e.wb=true;e.vx=-e.vx*0.45;e.vy=Math.min(e.vy,-2.2);shake(2,6);dust(e.x+dir*4,e.y-12,6);sfx('blunt');}
  else if(dir*e.vx>0)e.vx=0;
}
function land(e){
  switch(e.state){
    case 'air':e.state='idle';e.airHits=0;e.landT=e.anim;dust(e.x,GROUND,3);sfx('land');break;
    case 'attack':{const m=e.move;e.airHits=0;
      if(m&&m.dive){e.mt=m.su+m.ac;e.vx=0;shake(m.shock?3:1,6);dust(e.x,GROUND,8);if(m.shock)spawnShock(e);sfx(m.shock?'heavy':'land');}
      else if(m&&m.air){endMove(e);dust(e.x,GROUND,3);}
      break;}
    case 'juggle':
      if(e.gb&&!e.gbUsed){e.gbUsed=true;e.gb=false;e.vy=-3.4;e.vx*=0.5;e.air=true;e.y=GROUND-1;shake(2,6);dust(e.x,GROUND,10);sfx('heavy');}
      else{e.state='down';e.st=0;e.vx*=0.4;dust(e.x,GROUND,8);sfx('land');shake(1,4);}
      break;
    case 'ko':
      if(!e.koB){e.koB=true;e.vy=-1.8;e.air=true;e.y=GROUND-1;dust(e.x,GROUND,8);}else e.vx=0;
      break;
  }
}
function bounds(e){
  if(e.side==='p'){if(lock)return [lock.l+6,lock.r-6];return [Math.max(6,camX+6),Math.min(WORLD_W-6,camX+W-6)];}
  const L=lock?lock.l:camX,R=lock?lock.r:camX+W;
  if(e.entering){if(e.x>L+10&&e.x<R-10)e.entering=false;return [-999,99999];}
  return [L+6,R-6];
}
function separate(){
  const solid=e=>!e.air&&!e.entering&&(e.state==='idle'||e.state==='walk'||e.state==='attack'||e.state==='hurt'||e.state==='charge'||e.state==='squat');
  for(let i=0;i<F.length;i++)for(let j=i+1;j<F.length;j++){
    const a=F[i],b=F[j];if(!solid(a)||!solid(b))continue;
    const min=(a.side===b.side?5:7)*(a.S+b.S),dx=b.x-a.x;
    if(Math.abs(dx)<min){const push=Math.min(1.2,(min-Math.abs(dx))/2),s=dx===0?(Math.random()<.5?-1:1):Math.sign(dx);a.x-=push*s;b.x+=push*s;}
  }
}

/* ================================================================
   COMBAT
   ================================================================ */
function box(a,hb){const S=a.S;const x0=a.f>0?a.x+hb[0]*S:a.x-(hb[0]+hb[2])*S;return {x:x0,y:a.y+hb[1]*S,w:hb[2]*S,h:hb[3]*S};}
function hurtBox(t){
  if(t.rm||t.state==='ko')return null;const S=t.S;
  if(t.state==='down'||t.state==='getup')return {x:t.x-12*S,y:t.y-8*S,w:24*S,h:8*S};
  if(t.state==='juggle')return {x:t.x-8*S,y:t.y-26*S,w:16*S,h:24*S};
  if(t.state==='dash')return {x:t.x-6*S,y:t.y-16*S,w:12*S,h:16*S};
  return {x:t.x-6*S,y:t.y-32*S,w:12*S,h:32*S};
}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function crateBox(c){return {x:c.x-8,y:GROUND-15,w:16,h:15};}

function applyHit(a,t,m,cx,cy){
  if(t.iframes>0||t.state==='ko'||t.rm)return false;
  if(!m.ult&&(t.state==='getup'||t.state==='dash'||(t.state==='down'&&t.st>10)))return false;
  if(blocks(a,t,m)){                                  // a Bulwark's shield stops light hits from the front
    const sx=t.x+t.f*9*t.S,sy=t.y-20*t.S;t.blockT=10;t.vx=-t.f*0.9;a.hitstop=Math.max(a.hitstop||0,3);t.hitstop=3;
    sparks(sx,sy,7,'#bfe9ff',2.4);impact(sx,sy,false,'#bfe9ff',false,-t.f);sfx('armor',false,{x:sx});
    if(a.side==='p'&&a.state==='attack'){a.hitConfirm=true;if(!a.air)a.vx=-a.f*1.3;}
    nums.push({x:sx,y:sy-8,s:'block',c:'#bfe9ff',t:0});
    hint('shield','bulwarks block light hits: use K heavy or hit them from behind','Bulwarks block light hits: use HEAVY or get behind them');
    return true;
  }
  const guardBreak=t.T.shield&&guarding(t)&&(a.x-t.x)*t.f>0;
  const f=m.away?(t.x>=a.x?1:-1):a.f,dmg=t.side==='p'?Math.max(1,Math.round(m.dmg*diff().dmg)):m.dmg;
  if(guardBreak){floatText(t.x,t.y-44*t.S,'guard break!','#ffb347');sfx('break');}
  const lastMulti=!m.multi||(a.mt>=m.su+m.ac-m.multi);
  const knock=m.knock&&lastMulti,kb=(lastMulti&&m.fkb)||m.kb;
  if(a.side==='p'&&!m.ult)meter=Math.min(100,meter+dmg*0.8);

  const sc=wpn?wpn.spark:'#ffd36b';

  else kickX+=f*0.5;
  if(S.numbers)nums.push({x:cx+rnd(-3,3),y:cy-6,s:String(dmg),c:a.side==='p'?(dmg>=14?'#ff9a3c':dmg>=9?'#ffe08a':'#ffffff'):'#ff5a4a',t:0,sz:a.side==='p'&&dmg>=14?2:1,vx:f*0.25});
  if(a.side==='p')buzz(big?18:7);
  if(t.side==='p'){hurtT=14;buzz(40);punch(t.x-camX,t.y-18,6,-f*1.5,0);}
  sfx(wpn?wpn.hit:(a.weapon&&a.weapon.id==='hammer'?'heavy':a.weapon&&a.weapon.id==='knife'?'blade':'blunt'),stop>=9,
    {x:cx,rate:a.side==='p'?1+Math.min(combo.n,20)*0.004:1});   // the hero's hits climb a little in pitch as the combo grows

  if(armored){t.armorT=6;t.flash=0;sfx('armor',false,{x:t.x});return true;}
  releaseToken(t);
  if(t.state==='attack'){t.move=null;t.act=false;t.trail.length=0;}
  const decay=Math.max(0.4,1-t.juggle*0.06),bossMul=t.T.boss?0.55:1;

  else if(m.launch){t.state='juggle';t.air=true;t.vy=kb[1]*decay*bossMul;t.vx=f*kb[0];}

  else{t.state='hurt';t.st=m.hs;t.vx=f*kb[0];}

}
// the whoosh of a swing: the hero's own weapon, raiders a quieter one; heavy, charged and launching moves get the big one.

function swingKey(e,m){const id=e.side==='p'?e.weapon.id:e.weapon.id==='knife'?'sword':e.weapon.id==='hammer'?'axe':'fists';return 'sw_'+id+(m.dmg>=12||m.charge||m.launch?'B':'');}

function comboRank(n){return n>=35?'LEGENDARY':n>=20?'BRUTAL':n>=10?'GREAT':n>=5?'NICE':'';}

function resolveHits(){
  for(const a of F){
    if(a.state!=='attack'||!a.act||!a.move)continue;
    const m=a.move,hb=box(a,m.hb);let hit=false;
    for(const t of F){
      if(t.side===a.side||a.hitIds.has(t))continue;
      const hu=hurtBox(t);if(!hu||!overlap(hb,hu))continue;
      const cx=(Math.max(hb.x,hu.x)+Math.min(hb.x+hb.w,hu.x+hu.w))/2,cy=(Math.max(hb.y,hu.y)+Math.min(hb.y+hb.h,hu.y+hu.h))/2;
      if(applyHit(a,t,m,cx,cy)){a.hitIds.add(t);hit=true;}
    }
    if(a.side==='p')for(const c of crates)if(!c.broken&&!a.hitIds.has(c)&&overlap(hb,crateBox(c))){a.hitIds.add(c);breakCrate(c);}
    if(a.side==='p')for(const w of projs)if(w.kind==='knife'&&w.side==='e'&&overlap(hb,knifeBox(w))){   // hit a thrown knife back at the raiders
      w.side='p';w.dir=a.f;w.spd=4.6;w.dmg=10;w.c='#ffd36b';w.t=0;w.hitIds.clear();a.hitstop=Math.max(a.hitstop,5);
      sparks(w.x,w.y,10,'#ffd36b',2.8);ring(w.x,w.y,'#ffd36b');sfx('armor');floatText(w.x,w.y-10,'deflect!','#ffd36b');meter=Math.min(100,meter+4);}
    if(hit&&a.side==='p'){
      if(!a.durUsed){a.durUsed=true;useDur(a);}
      if(m.dive&&m.bounce){a.move=null;a.act=false;a.state='air';a.vy=-3.8;a.vx=-a.f*0.8;}
      else if(m.halt&&a.mt<m.su+m.ac){a.mt=m.su+m.ac;a.act=false;a.vx=a.f*0.6;}   // a rush stops where it connects
      if(m.hop&&!a.air){a.vy=m.hop;a.air=true;a.mt=Math.max(a.mt,m.su+m.ac);a.act=false;}   // rise with them, ready to swing in the air
      if(m.pogo&&a.air){a.mt=Math.max(a.mt,m.su+m.ac);a.act=false;if((a.pogoN=(a.pogoN||0)+1)<=3)a.vy=-4.4;}   // bounce off them, three times per jump
    }

}

function spawnEnemy(type,side){

  readInput();

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();audioInit();pressed[k]=true;held[k]=true;b.classList.add('on');
    if(k==='L'){autoL.on=true;autoL.t=tickN;}
    try{b.setPointerCapture(e.pointerId);}catch(_){}
  });
  const up=()=>{held[k]=false;b.classList.remove('on');if(k==='L')autoL.on=false;};
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,up);
});
$('pauseBtn').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(mode==='play')mode='pause';});

/* ---------- full screen ---------- */
const docEl=document.documentElement;
const fsOk=!!(docEl.requestFullscreen||docEl.webkitRequestFullscreen);
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function goFullscreen(){
  const r=docEl.requestFullscreen||docEl.webkitRequestFullscreen;if(!r)return;
  try{const p=r.call(docEl,{navigationUI:'hide'});
    if(p&&p.then)p.then(()=>{try{if(touchOn()&&screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(_){}}).catch(()=>{});}catch(_){}
}
function toggleFs(){if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}else goFullscreen();}
function fsLabels(){document.querySelectorAll('[data-fs]').forEach(b=>{b.hidden=!fsOk;b.textContent=fsEl()?'Exit full screen':'Full screen';});}
document.addEventListener('fullscreenchange',()=>{fsLabels();setTimeout(fit,60);});
document.addEventListener('webkitfullscreenchange',()=>{fsLabels();setTimeout(fit,60);});
addEventListener('keydown',e=>{if(e.code==='KeyF'&&!e.repeat&&!e.ctrlKey&&!e.metaKey)toggleFs();},true);

/* ---------- menus ----------
   One base menu per mode (title, pause, over, clear); Settings and How to play stack on top.
   Arrow keys / WASD / d-pad move, Enter / Space / J / A choose, Esc / K / B go back. */
const MENU_FOR={title:'title',pause:'pause',over:'over',clear:'clear'};
const M={stack:[],sel:0,mode:null};
const menuEl=id=>$('m-'+id);
function navItems(){
  const id=M.stack[M.stack.length-1];if(!id)return [];
  const el=menuEl(id);
  if(id==='settings')return [...el.querySelectorAll('.setrow'),el.querySelector('.xbtn')];
  if(id==='help')return [...el.querySelectorAll('.tabs button'),el.querySelector('.xbtn')];
  return [...el.querySelectorAll('.mbtn')].filter(b=>!b.hidden);
}
function highlight(scroll){
  const it=navItems();M.sel=clamp(M.sel,0,Math.max(0,it.length-1));
  document.querySelectorAll('#menus .sel').forEach(n=>n.classList.remove('sel'));
  if(lastInput==='touch'||lastInput==='mouse'&&!scroll)return;
  const cur=it[M.sel];if(cur){cur.classList.add('sel');if(scroll)cur.scrollIntoView({block:'nearest'});}
}
function showMenus(){
  const top=M.stack[M.stack.length-1];
  document.querySelectorAll('#menus .menu').forEach(m=>m.classList.toggle('open',m.id==='m-'+top));
  if(top==='title')refreshTitle();if(top==='over')refreshOver();if(top==='clear')refreshClear();if(top==='pause')refreshPause();
  M.sel=0;highlight(false);
}
function openSub(id){
  if(id==='settings')buildSettings();if(id==='help')buildHelp();
  M.stack.push(id);showMenus();sfx('uiOk');
}
function back(){
  if(M.stack.length>1){M.stack.pop();showMenus();sfx('uiBack');return;}
  if(M.stack[0]==='pause'){mode='play';sfx('uiBack');}
}
function syncMenus(){
  if(mode===M.mode)return;M.mode=mode;
  const b=MENU_FOR[mode];M.stack=b?[b]:[];showMenus();
  document.getElementById('touch').classList.toggle('live',mode==='play');
  if(mode==='play')stickRest();
}
hooks.menuOpen=()=>M.stack.length>0;
function act(name){
  const A={
    play(){if(touchOn()&&fsOk&&!fsEl())goFullscreen();startPlay();},
    resume(){mode='play';},
    help(){openSub('help');},
    settings(){openSub('settings');},
    fullscreen(){toggleFs();},
    restart(){newGame();startPlay();},
    quit(){toTitle();},
    continue(){doContinue();},
    back(){back();},
    weapon(){const ids=Object.keys(WEAPONS),id=ids[(ids.indexOf(player.weapon.id)+1)%ids.length];equip(id);refreshPause();},
  };
  if(A[name]){if(name!=='back'&&name!=='help'&&name!=='settings')sfx('uiOk');A[name]();}
}
function startPlay(){mode='play';fadeT=24;hintCur=null;showBanner('Fight!','#f2a33a',60);sfx('go');}
function toTitle(){newGame();player.x=90;camX=0;refreshPose(player);mode='title';}
document.getElementById('menus').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(b)act(b.dataset.act);
});
document.getElementById('menus').addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse')return;const it=navItems(),i=it.findIndex(n=>n.contains(e.target));
  if(i>=0&&i!==M.sel){M.sel=i;lastInput='mouse';highlight(false);it[i].classList.add('sel');}
});
function nav(kind,d){
  const it=navItems();if(!it.length&&kind!=='back')return;
  const cur=it[M.sel];
  if(kind==='move'){M.sel=(M.sel+d+it.length)%it.length;highlight(true);sfx('ui');return;}
  if(kind==='adjust'){
    if(cur&&cur.classList.contains('setrow')){changeSetting(cur.dataset.k,d);return;}
    if(cur&&cur.parentNode.classList.contains('tabs')){const sib=[...cur.parentNode.children],nx=sib[clamp(sib.indexOf(cur)+d,0,sib.length-1)],key=nx.dataset.tab||nx.dataset.w;
      nx.click();M.sel=Math.max(0,navItems().findIndex(n=>(n.dataset.tab||n.dataset.w)===key));highlight(true);sfx('ui');return;}
    if(M.stack[M.stack.length-1]!=='settings'&&M.stack[M.stack.length-1]!=='help'){nav('move',d);}
    return;
  }
  if(kind==='ok'){
    if(!cur)return;
    if(cur.classList.contains('setrow')){changeSetting(cur.dataset.k,1,true);return;}
    const key=cur.dataset.tab||cur.dataset.w;cur.click();
    if(key){sfx('ui');M.sel=Math.max(0,navItems().findIndex(n=>(n.dataset.tab||n.dataset.w)===key));highlight(true);}
    return;
  }
  if(kind==='back')back();
  if(kind==='start'){if(M.stack.length===1&&M.stack[0]==='pause')act('resume');else nav('ok');}
}
hooks.menuNav=nav;
hooks.menuKey=e=>{
  const c=e.code,map={ArrowUp:['move',-1],KeyW:['move',-1],ArrowDown:['move',1],KeyS:['move',1],ArrowLeft:['adjust',-1],KeyA:['adjust',-1],ArrowRight:['adjust',1],KeyD:['adjust',1],
    Enter:['ok'],NumpadEnter:['ok'],Space:['ok'],KeyJ:['ok'],Escape:['back'],Backspace:['back'],KeyK:['back'],KeyP:['start']};
  const m=map[c];if(!m)return;
  e.preventDefault();if(e.repeat&&m[0]!=='move'&&m[0]!=='adjust')return;
  lastInput='key';
  if(c==='KeyP'&&!(M.stack.length===1&&M.stack[0]==='pause'))return;
  nav(m[0],m[1]);
};

/* ---------- menu text ---------- */
const isIOS=/iP(hone|od|ad)/.test(navigator.platform)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function fmtTime(t){const s=Math.floor(t/60);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function refreshTitle(){
  const parts=[];
  if(bestScore)parts.push('Best score <b>'+bestScore+'</b>');
  if(bestCombo)parts.push('Best combo <b>'+bestCombo+' hits</b>');
  let tip=touchOn()?(isIOS&&!fsOk?'Tip: add this page to your Home Screen to play full screen.':''):PAD.on?'Gamepad ready: A to choose, B to go back.':'<kbd>Enter</kbd> choose · <kbd>Esc</kbd> back · <kbd>F</kbd> full screen';
  $('titleNote').innerHTML=parts.join(' &nbsp;·&nbsp; ')+(parts.length&&tip?'<br>':'')+tip;
  fsLabels();
}
function refreshPause(){
  const wb=$('weaponBtn');wb.hidden=!S.training;wb.textContent='Weapon: '+WEAPONS[player.weapon.id].name;fsLabels();
}
function refreshOver(){$('overNote').innerHTML='Score <b>'+score+'</b> &nbsp;·&nbsp; continues used <b>'+continues+'</b>';}
function refreshClear(){
  const rows=[['Time',fmtTime(timeT)],['Score',score+(newBest?' <span class="new">new best!</span>':'')],['Best combo',bestCombo+' hits'],['Continues',continues],['Difficulty',diff().name]];
  $('clearStats').innerHTML=rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>').join('');
}

/* ---------- settings ---------- */
const onOff=v=>v?'On':'Off';
const SETTINGS=[
  {g:'Sound'},
  {k:'music',l:'Music',range:true},
  {k:'sfx',l:'Sound effects',range:true},
  {g:'Gameplay'},
  {k:'difficulty',l:'Difficulty',opts:[0,1,2],fmt:v=>DIFF[v].name,sub:'Easy: raiders hit softer and attack one at a time'},
  {k:'aim',l:'Auto-aim',opts:[false,true],fmt:onOff,sub:'Attacks turn toward the nearest raider'},
  {k:'autoAtk',l:'Hold ATTACK to combo',opts:[false,true],fmt:onOff,sub:'Touch: keep the button held to keep swinging',show:()=>touchOn()},
  {g:'Screen'},
  {k:'shake',l:'Screen shake',opts:[0,1,2],fmt:v=>['Off','Low','Full'][v],sub:'Also the zoom punch on big hits'},
  {k:'flash',l:'Flashes',opts:[false,true],fmt:onOff},
  {k:'numbers',l:'Damage numbers',opts:[false,true],fmt:onOff},
  {g:'Touch controls'},
  {k:'touch',l:'Touch controls',opts:['auto','on','off'],fmt:v=>({auto:'Auto',on:'On',off:'Off'})[v]},
  {k:'stick',l:'Joystick',opts:['fixed','float'],fmt:v=>v==='fixed'?'Fixed':'Floating',sub:'Fixed stays in the corner; floating appears where you touch'},
  {k:'btn',l:'Button size',opts:[0,1,2],fmt:v=>['Small','Medium','Large'][v]},
  {k:'haptics',l:'Vibration',opts:[false,true],fmt:onOff,show:()=>!!navigator.vibrate},
  {g:'Training'},
  {k:'training',l:'Training tools',opts:[false,true],fmt:onOff,sub:'1–4 swap weapons, 0 fills ULT, H hitboxes; weapon switch in the pause menu'},
  {k:'hitboxes',l:'Show hitboxes',opts:[false,true],fmt:onOff,show:()=>S.training},
];
function settingVal(d){
  if(d.range)return S[d.k]+'%<span class="meter"><i style="width:'+S[d.k]+'%"></i></span>';
  return d.fmt(S[d.k]);
}
function buildSettings(){
  let h='';
  for(const d of SETTINGS){
    if(d.g){h+='<div class="group">'+d.g+'</div>';continue;}
    if(d.show&&!d.show())continue;
    h+='<div class="setrow" data-k="'+d.k+'"><span class="lbl">'+d.l+(d.sub?'<small>'+d.sub+'</small>':'')+'</span>'+
      '<span class="stepper"><button type="button" data-d="-1" aria-label="Less">‹</button><span class="val">'+settingVal(d)+'</span><button type="button" data-d="1" aria-label="More">›</button></span></div>';
  }
  $('settingsList').innerHTML=h;
}
$('settingsList').addEventListener('click',e=>{const b=e.target.closest('button[data-d]');if(!b)return;const row=b.closest('.setrow');
  M.sel=navItems().indexOf(row);changeSetting(row.dataset.k,+b.dataset.d);});
function changeSetting(k,d,wrap){
  const def=SETTINGS.find(s=>s.k===k);if(!def)return;
  if(def.range)S[k]=clamp(S[k]+d*10,0,100);
  else{const o=def.opts,i=o.indexOf(S[k]);let j=i+d;if(wrap)j=(j+o.length)%o.length;else j=clamp(j,0,o.length-1);S[k]=o[j];}
  saveSettings();sfx('ui');
  if(k==='music'||k==='sfx')applyVolumes();
  if(k==='touch'||k==='btn'||k==='stick')applyTouch();
  if(k==='difficulty')tokens=Math.max(0,diff().tokens-F.filter(e=>e.token).length);
  const keep=M.sel;buildSettings();M.sel=keep;highlight(lastInput==='key'||lastInput==='pad');
  if(lastInput!=='key'&&lastInput!=='pad'){const it=navItems();if(it[keep])it[keep].classList.add('sel');}
}

/* ---------- how to play ---------- */
const TAGS=[['charge','Charged'],['launch','Launcher'],['jc','Jump cancel'],['spike','Spike'],['knock','Knockdown'],['armor','Armor'],['shock','Shockwave'],
  ['wave','Projectile'],['quake','Hits whole screen'],['pull','Pulls in'],['multi','Multi-hit'],['dive','Dive'],['low','Low, under shields'],['hop','Rises with them'],['pogo','Bounces you up']];
const kb=s=>'<kbd class="k">'+s+'</kbd>';
function inputLabel(s){
  const t=touchOn();
  return s.split(' ').map(x=>x==='J'?kb(t?'ATTACK':'J'):x==='K'?kb(t?'HEAVY':'K'):x==='L'?kb(t?'ULT':'L'):x==='↑'||x==='↓'?kb(x):x).join(' ');
}
const HELP={tab:'controls',weapon:'fists'};
function controlsHTML(){
  const rows=(title,r)=>'<div class="group">'+title+'</div><table class="keys">'+r.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join('')+'</table>';
  const touch=rows('Touch',[['Move',S.stick==='fixed'?'drag the stick in the bottom-left corner':'drag anywhere on the left half of the screen'],['ATTACK','light attack; hold it to keep the combo going'],['HEAVY','heavy attack; hold to charge, let go to release'],
    ['JUMP','jump; push the stick sideways to jump that way'],['DASH','quick invincible dash, works once in the air'],['Launcher','push the stick up or down, then HEAVY'],['Low sweep','push the stick down, then ATTACK'],['Rising strike','push the stick up, then ATTACK'],['Air pogo','in the air, stick down + ATTACK'],['Air dive','in the air, stick down + HEAVY'],['ULT','glows when the bar is full'],['Pause','II in the top corner']]);
  const keys=rows('Keyboard',[['Move',kb('←')+' '+kb('→')+' or '+kb('A')+' '+kb('D')],['Jump',kb('↑')+' / '+kb('W')+' / '+kb('Space')+', hold a direction to jump that way'],
    ['Dash',kb('Shift')+' or tap '+kb('←')+' / '+kb('→')+' twice (invincible)'],['Light attack',kb('J')+' or '+kb('Z')],['Heavy attack',kb('K')+' or '+kb('X')+', hold to charge'],
    ['Launcher',kb('↓')+' + '+kb('K')+', or '+kb('↑')+' + '+kb('K')+' to jump after them'],['Low sweep',kb('↓')+' + '+kb('J')],['Rising strike',kb('↑')+' + '+kb('J')+' together'],['Air pogo','in the air, '+kb('↓')+' + '+kb('J')],['Air dive','in the air, '+kb('↓')+' + '+kb('K')],['Ultimate',kb('L')+' or '+kb('U')+' when the ULT bar is full'],
    ['Pause',kb('Esc')+' or '+kb('P')],['Full screen',kb('F')],['Sound',kb('M')+' mutes']]);
  const pad=rows('Gamepad',[['Move','left stick or d-pad'],['Jump / Dash','A / B'],['Light / Heavy','X / Y (hold Y to charge)'],['Ultimate','RB or RT'],['Pause','Start']]);
  return touchOn()?touch+keys+pad:keys+pad+touch;
}
function movesHTML(){
  const w=WEAPONS[HELP.weapon];
  let h='<div class="tabs" id="wTabs">'+Object.keys(WEAPONS).map(id=>'<button type="button" data-w="'+id+'" aria-selected="'+(id===HELP.weapon)+'">'+WEAPONS[id].name+'</button>').join('')+'</div>';
  h+='<p class="wmeta"><b>'+w.name+'.</b> '+w.desc+(w.dur===Infinity?'':' Breaks after <b>'+w.dur+' hits</b>.')+'</p>';
  h+='<table class="moves"><thead><tr><th>Input</th><th>Move</th><th style="text-align:right">Dmg</th><th>Notes</th></tr></thead><tbody>';
  for(const k of ORDER){const m=w.moves[k],hits=m.multi?Math.ceil(m.ac/m.multi):1;
    const tags=TAGS.filter(([p])=>m[p]).map(([,l])=>'<span class="tag-l">'+l+'</span>').join('');
    h+='<tr><td>'+inputLabel(INPUTS[k])+'</td><td>'+m.n+'</td><td class="num">'+(hits>1?m.dmg+'×'+hits:m.dmg)+'</td><td>'+(tags||'–')+'</td></tr>';}
  h+='<tr><td>'+inputLabel('L')+' (full bar)</td><td>'+ULT.name+'</td><td class="num">'+ULT.hit.dmg+'×'+ULT.strikes+' + '+ULT.end.dmg+'</td><td><span class="tag-l">Ultimate</span><span class="tag-l">Invincible</span></td></tr>';
  h+='</tbody></table>'+w.tryCombo.map(c=>'<p class="try"><b>TRY</b>'+c.replace(/\bJ\b/g,touchOn()?'ATTACK':'J').replace(/\bK\b/g,touchOn()?'HEAVY':'K')+'</p>').join('');
  return h;
}
function tipsHTML(){
  return '<ul class="tips">'+[
    '<b>Break crates</b> for weapons and rations. Weapons break after a number of hits; your fists never do.',
    'Raiders <b>flash red</b> just before they strike. Dash through the hit: you are invincible while dashing.',
    '<b>Launch</b> raiders with up or down + heavy, follow them into the air and keep hitting.',
    'A fifth light hit chases a knocked-back raider and launches them. Down + light sweeps low, under a Bulwark\'s shield.',
    'Dashing the wrong way? Hold the other direction to turn, or dash again to dash back.',
    'Up + light lifts you into the air with the raider. In the air, down + light bounces off their head, up to three times a jump.',
    'The thin bar under the combo counter shows how long you have to land the next hit.',
    'Landing hits and taking damage fill the <b>ULT</b> bar. When it is full, Shade Requiem hits every raider on screen.',
    '<b>Slingers</b> throw knives from a distance: jump or dash over them, or hit a knife back at them.',
    '<b>Bulwarks</b> block light hits from the front. Break the guard with a heavy, charged or launching attack, or get behind them.',
    'The boss marks the ground in <b>red</b> before a slam or a charge. Get out of the red.',
    'Too hard or too easy? Change the <b>difficulty</b> in Settings at any time.',
  ].map(t=>'<li>'+t+'</li>').join('')+'</ul>';
}
// sound test: every take has its own number, so you can say which one you mean
function soundsHTML(){
  const row=(title,btns)=>'<div class="group">'+title+'</div><div class="tabs">'+btns.map(([l,k,i])=>'<button type="button" data-snd="'+k+'"'+(i===undefined?'':' data-take="'+i+'"')+'>'+l+'</button>').join('')+'</div>';
  const takes=(k,l)=>Array.from({length:SND[k][2]},(_,i)=>[l+' '+(i+1),k,i]);
  return '<p class="wmeta">Every sound is made by the game itself, no recordings. Tap one to hear it.</p>'+
    row('Raider screams',takes('vDie','Scream'))+row('Raider grunts',takes('vHurt','Grunt'))+row('Boss',takes('vBoss','Growl').concat([['Roar','vBossKO',0]]))+
    row('Hero',takes('vPlayer','Hurt'))+row('Dash',takes('dash','Dash').concat(takes('dashAir','Air dash')))+
    row('Swings',[['Fists','sw_fists'],['Sword','sw_sword'],['Spear','sw_spear'],['Axe','sw_axe'],['Fists heavy','sw_fistsB'],['Sword heavy','sw_swordB'],['Spear heavy','sw_spearB'],['Axe heavy','sw_axeB']])+
    row('Hits',[['Fists','blunt'],['Sword','blade'],['Spear','pierce'],['Axe','heavy'],['Fists big','bluntB'],['Sword big','bladeB'],['Spear big','pierceB'],['Axe big','heavyB'],['Shield','armor']])+
    row('Other',[['Jump','jump'],['Land','land'],['KO','ko'],['Shockwave','boom'],['Crate','break'],['Weapon breaks','shatter']]);
}
function buildHelp(){
  const tabs=[['controls','Controls'],['moves','Moves'],['tips','Tips'],['sounds','Sounds']];
  $('helpTabs').innerHTML=tabs.map(([id,l])=>'<button type="button" role="tab" data-tab="'+id+'" aria-selected="'+(id===HELP.tab)+'">'+l+'</button>').join('');
  $('helpBody').innerHTML=HELP.tab==='controls'?controlsHTML():HELP.tab==='moves'?movesHTML():HELP.tab==='sounds'?soundsHTML():tipsHTML();
}
$('m-help').addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){HELP.tab=t.dataset.tab;const keep=M.sel;buildHelp();M.sel=keep;highlight(false);return;}
  const w=e.target.closest('[data-w]');if(w){HELP.weapon=w.dataset.w;const keep=M.sel;buildHelp();M.sel=keep;highlight(false);return;}
  const sb=e.target.closest('[data-snd]');if(sb){audioInit();sfx(sb.dataset.snd,false,{take:sb.dataset.take===undefined?undefined:+sb.dataset.take});}
});

/* ---------- per frame: keep the DOM in step with the game ---------- */
hooks.render=()=>{
  syncMenus();
  const ready=meter>=100&&mode==='play';
  if(ready!==ultReady){ultReady=ready;ultBtn.classList.toggle('ready',ready);}
};
applyTouch();fsLabels();syncMenus();
window.__sd.ui={act,nav,get stack(){return M.stack.slice();},S,fit,applyTouch};

})();
</script>
