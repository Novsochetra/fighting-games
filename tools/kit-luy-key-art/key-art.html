<!doctype html>
<html lang="km">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>គិតលុយ key art</title>
    <link rel="stylesheet" href="../../apps/web/games/kit-luy/styles/tokens.css" />
    <link rel="stylesheet" href="../../apps/web/games/kit-luy/styles/fonts.css" />
    <link rel="stylesheet" href="../../apps/web/games/kit-luy/styles/stools.css" />
    <link rel="stylesheet" href="../../apps/web/games/kit-luy/styles/pieces.css" />
    <link rel="stylesheet" href="./key-art.css" />
  </head>
  <body>
    <svg class="defs" width="0" height="0" aria-hidden="true">
      <defs>
        <pattern id="krama" width="6" height="6" patternUnits="userSpaceOnUse">
          <rect class="krama-paper" width="6" height="6" />
          <rect class="krama-check" width="3" height="6" />
          <rect class="krama-check" width="6" height="3" />
        </pattern>
      </defs>
    </svg>
    <div class="scene" id="scene">
      <div class="sky"></div>
      <div class="moon"></div>
      <svg class="stars" id="stars" aria-hidden="true"></svg>
      <svg class="skyline" id="skyline" aria-hidden="true"></svg>
      <div class="street"></div>
      <div class="stalls" id="stalls"></div>
      <div class="seats" id="seats"></div>
      <div class="counter" id="counter">
        <div class="slip">
          <p class="slip-sum">៥០០ + ៥០០</p>
          <p class="slip-total">= ១,០០០៛</p>
        </div>
      </div>
      <div class="awning"></div>
      <svg class="lights" id="lights" aria-hidden="true"></svg>
    </div>
    <script type="module">
      import { paintScene } from './scene.js';

      paintScene(document, new URLSearchParams(location.search));
    </script>
  </body>
</html>
