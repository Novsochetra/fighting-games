<!doctype html>
<html lang="km">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>គិតលុយ · Kit Luy, a free riel math game</title>
    <meta
      name="description"
      content="គិតលុយ (Kit Luy) is a fast mental-math game in Khmer riel: add, take away, multiply and divide prices against the clock, chain right answers and fill your piggy bank. In Khmer and English."
    />
    <link rel="canonical" href="https://www.khmerarcade.games/games/kit-luy/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Retro Arcade" />
    <meta property="og:title" content="គិតលុយ · Kit Luy, a riel math rush" />
    <meta
      property="og:description"
      content="Add, take away, multiply and divide prices in Khmer riel against the clock. Chain right answers, beat your best and fill your piggy bank. Free to play in your browser."
    />
    <meta property="og:url" content="https://www.khmerarcade.games/games/kit-luy/" />
    <meta
      property="og:image"
      content="https://www.khmerarcade.games/games/kit-luy/assets/social/title-screen.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The គិតលុយ title screen: its gold logo and a pink piggy bank under market lights at dusk"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#120a24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="គិតលុយ" />
    <link rel="manifest" href="assets/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      href="assets/fonts/koulen-khmer-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/koulen-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/page.css" />
    <link rel="stylesheet" href="styles/hud.css" />
    <link rel="stylesheet" href="styles/note.css" />
    <link rel="stylesheet" href="styles/answers.css" />
    <link rel="stylesheet" href="styles/pops.css" />
    <link rel="stylesheet" href="styles/menus.css" />
    <link rel="stylesheet" href="styles/title.css" />
    <link rel="stylesheet" href="styles/results.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div id="app" data-view="title">
      <canvas id="backdrop" aria-hidden="true"></canvas>

      <main class="stage" id="stage">
        <header class="hud">
          <button class="hud-pause" data-act="pause" data-i18n-label="hud.pause">II</button>
          <div class="hud-till">
            <canvas class="piggy" id="hudPiggy" width="24" height="22" aria-hidden="true"></canvas>
            <output class="hud-score" id="score">0៛</output>
          </div>
          <div class="hud-level">
            <span id="level"></span>
            <span class="pips" id="levelPips" aria-hidden="true"></span>
          </div>
        </header>

        <div class="clock" id="clock" role="timer">
          <span class="clock-seconds" id="clockSeconds"></span>
          <span class="clock-bar"><i class="clock-fill" id="clockFill"></i></span>
        </div>

        <div class="board">
          <section class="note" id="note" aria-live="polite">
            <span class="note-sign" aria-hidden="true"></span>
            <span class="combo" id="combo" hidden></span>
            <p class="note-caption" id="caption"></p>
            <p class="note-sum" id="sum">?</p>
            <span class="pips streak" id="streakPips" aria-hidden="true"></span>
          </section>

          <div class="answers" id="answers">
            <button class="answer" data-answer="0"><kbd>1</kbd><span></span></button>
            <button class="answer" data-answer="1"><kbd>2</kbd><span></span></button>
            <button class="answer" data-answer="2"><kbd>3</kbd><span></span></button>
            <button class="answer" data-answer="3"><kbd>4</kbd><span></span></button>
          </div>
        </div>
      </main>

      <div class="pops" id="pops" aria-hidden="true"></div>
      <p class="banner" id="banner" aria-hidden="true"></p>
      <canvas id="fx" aria-hidden="true"></canvas>

      <div id="menus">
        <section class="menu" id="m-title" aria-label="គិតលុយ">
          <div class="title-head">
            <h1 class="logo">គិតលុយ<span data-i18n="title.tagline"></span></h1>
            <canvas
              class="piggy piggy-big"
              id="titlePiggy"
              width="24"
              height="22"
              aria-hidden="true"
            ></canvas>
            <dl class="stats">
              <div>
                <dt data-i18n="title.best"></dt>
                <dd id="titleBest"></dd>
              </div>
              <div>
                <dt data-i18n="title.savings"></dt>
                <dd id="titleSavings"></dd>
              </div>
            </dl>
            <div class="rank">
              <span class="rank-name" id="titleRank"></span>
              <span class="rank-bar"><i id="titleRankFill"></i></span>
              <span class="rank-next" id="titleNext"></span>
            </div>
          </div>
          <div class="title-actions">
            <div class="mix" role="group" aria-labelledby="mixLabel">
              <span class="mix-label" id="mixLabel" data-i18n="title.mix"></span>
              <button class="chip" data-op="add" data-i18n-label="op.add">+</button>
              <button class="chip" data-op="sub" data-i18n-label="op.sub">−</button>
              <button class="chip" data-op="mul" data-i18n-label="op.mul">×</button>
              <button class="chip" data-op="div" data-i18n-label="op.div">÷</button>
            </div>
            <div class="mlist mlist-paired">
              <button class="mbtn primary" data-act="play" data-i18n="menu.play"></button>
              <button class="mbtn half" data-act="help" data-i18n="menu.help"></button>
              <button class="mbtn half" data-act="settings" data-i18n="menu.settings"></button>
              <button class="mbtn" data-act="arcade" data-i18n="menu.arcade"></button>
            </div>
          </div>
        </section>

        <section class="menu dim" id="m-pause" aria-labelledby="pauseTitle">
          <h2 class="mtitle" id="pauseTitle" data-i18n="menu.paused"></h2>
          <div class="mlist">
            <button class="mbtn primary" data-act="resume" data-i18n="menu.resume"></button>
            <button class="mbtn" data-act="play" data-i18n="menu.restart"></button>
            <button class="mbtn" data-act="settings" data-i18n="menu.settings"></button>
            <button class="mbtn" data-act="quit" data-i18n="menu.quit"></button>
          </div>
        </section>

        <section class="menu dim" id="m-over" aria-labelledby="overTitle">
          <h2 class="mtitle" id="overTitle" data-i18n="over.title"></h2>
          <div class="panel results">
            <p class="results-stamp" id="overStamp" hidden></p>
            <p class="results-label" data-i18n="over.earned"></p>
            <p class="results-score" id="overScore"></p>
            <dl class="stats stats-four">
              <div>
                <dt data-i18n="over.correct"></dt>
                <dd id="overCorrect"></dd>
              </div>
              <div>
                <dt data-i18n="over.accuracy"></dt>
                <dd id="overAccuracy"></dd>
              </div>
              <div>
                <dt data-i18n="over.streak"></dt>
                <dd id="overStreak"></dd>
              </div>
              <div>
                <dt data-i18n="over.level"></dt>
                <dd id="overLevel"></dd>
              </div>
            </dl>
            <div class="rank">
              <span class="rank-name" id="overRank"></span>
              <span class="rank-bar"><i id="overRankFill"></i></span>
              <span class="rank-next" id="overNext"></span>
            </div>
          </div>
          <div class="mlist">
            <button class="mbtn primary" data-act="play" data-i18n="menu.again"></button>
            <button class="mbtn" data-act="quit" data-i18n="menu.quit"></button>
            <button class="mbtn" data-act="arcade" data-i18n="menu.arcade"></button>
          </div>
        </section>

        <section class="menu dim" id="m-settings" aria-labelledby="settingsTitle">
          <div class="panel">
            <header class="panel-head">
              <h2 id="settingsTitle" data-i18n="menu.settings"></h2>
              <button class="xbtn" data-act="back" data-i18n="menu.back"></button>
            </header>
            <div class="rows" id="settingsRows"></div>
          </div>
        </section>

        <section class="menu dim" id="m-help" aria-labelledby="helpTitle">
          <div class="panel">
            <header class="panel-head">
              <h2 id="helpTitle" data-i18n="menu.help"></h2>
              <button class="xbtn" data-act="back" data-i18n="menu.back"></button>
            </header>
            <ol class="help">
              <li data-i18n="help.answer"></li>
              <li data-i18n="help.time"></li>
              <li data-i18n="help.combo"></li>
              <li data-i18n="help.fast"></li>
              <li class="help-keys" data-i18n="help.keys"></li>
            </ol>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
