<!doctype html>

    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"

      rel="preload"
      href="assets/sprites/heroes/bokator/arsenal/hero_walk.png"

      content="A side-scrolling pixel-art brawler. Pick one of seven heroes, pick up weapons, chain combos and fight along twelve painted missions, from six forests into the desert and on to the temples of Angkor, against nineteen kinds of raiders and a boss on every road."
    />

        <svg class="loader-reflection" viewBox="0 0 232 60" aria-hidden="true">
          <use href="#loaderSkyline" />
        </svg>
        <div
          class="loader-ledge"
          role="progressbar"
          aria-label="Loading"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span class="loader-groove">
            <span class="loader-fill"></span>
            <span class="loader-walker"><span class="loader-hero"></span></span>
          </span>
        </div>
        <p class="loader-caption" aria-hidden="true">
          <span>Loading</span><span class="loader-percent">0%</span>
        </p>
      </div>

    <div id="app">
      <div id="stage">
        <canvas
          id="game"
          width="768"
          height="432"
          tabindex="0"
          aria-label="Steel and Dust game screen"
        ></canvas>
      </div>

      <div class="touch live" id="touch" aria-hidden="true">
        <div class="stick-zone" id="stickZone">
          <div class="stick-base" id="stickBase"><div class="stick-knob" id="stickKnob"></div></div>
        </div>
        <div class="btns">
          <button class="tb tb-ult" data-action="ult" tabindex="-1">ULT</button>
          <button class="tb tb-dash" data-action="dash" tabindex="-1">DASH</button>
          <button class="tb tb-jump" data-action="jump" tabindex="-1">JUMP</button>
          <button class="tb tb-heavy" data-action="heavy" tabindex="-1">HEAVY</button>
          <button class="tb tb-atk" data-action="light" tabindex="-1">ATTACK</button>
        </div>
        <button class="tb-pause" id="pauseBtn" tabindex="-1" aria-label="Pause">II</button>
      </div>

      <div id="menus">
        <div class="menu-scene" id="menuScene" aria-hidden="true"></div>
        <div class="menu-dim" aria-hidden="true"></div>

        <section class="menu" id="m-title" aria-label="Main menu">
          <h1 class="logo">Steel &amp; Dust<span>pixel brawler</span></h1>
          <div class="mlist">
            <button class="mbtn primary" data-act="play">Play</button>
            <button class="mbtn" data-act="help">How to play</button>
            <button class="mbtn" data-act="settings">Settings</button>
            <button class="mbtn" data-act="fullscreen" data-fs>Full screen</button>
            <button class="mbtn" data-act="arcade">Back to arcade</button>
          </div>
          <p class="mnote" id="titleNote"></p>
          <p class="rotate" id="rotateHint">↻ turn your phone sideways for a bigger view</p>
        </section>

        <section class="menu" id="m-pause" aria-label="Paused">
          <h2 class="mtitle">Paused</h2>
          <div class="mlist">
            <button class="mbtn primary" data-act="resume">Resume</button>
            <button class="mbtn" data-act="help">How to play</button>
            <button class="mbtn" data-act="settings">Settings</button>
            <button class="mbtn" data-act="weapon" id="weaponBtn" hidden>Weapon: Fists</button>
            <button class="mbtn" data-act="fullscreen" data-fs>Full screen</button>
            <button class="mbtn" data-act="restart">Restart</button>
            <button class="mbtn" data-act="quit">Quit to title</button>
          </div>
        </section>

        <section class="menu" id="m-over" aria-label="Defeated">
          <h2 class="mtitle bad" id="overTitle">You fell</h2>
          <p class="mnote" id="overNote"></p>
          <div class="mlist">
            <button class="mbtn primary" data-act="again" id="startOverBtn" hidden>
              Start from mission 1
            </button>
            <button class="mbtn primary" data-act="continue" id="continueBtn">Continue</button>
            <button class="mbtn" data-act="restart" id="restartMissionBtn">Restart mission</button>
            <button class="mbtn" data-act="quit">Quit to title</button>
          </div>
        </section>

        <section class="menu" id="m-clear" aria-label="All missions clear">
          <h2 class="mtitle good">All missions clear</h2>
          <dl class="stats" id="clearStats"></dl>
          <div class="mlist">
            <button class="mbtn primary" data-act="again">Play again</button>
            <button class="mbtn" data-act="quit">Title</button>
            <button class="mbtn" data-act="arcade">Back to arcade</button>
          </div>
        </section>

        <section class="menu sub" id="m-settings" aria-label="Settings">
          <div class="box stone-panel">
            <header>
              <h2>Settings</h2>
              <button class="xbtn stone-btn" data-act="back">Back</button>
            </header>
            <div class="scroll" id="settingsList"></div>
          </div>
        </section>

        <section class="menu sub heroes" id="m-heroes" aria-label="Choose your hero">
          <div class="box">
            <header>
              <h2>Choose your hero</h2>
              <button class="xbtn stone-btn" data-act="back">Back</button>
            </header>
            <div class="hero-stage" id="heroStage">
              <button class="hero-step" data-step="-1" aria-label="Previous hero"></button>
              <div class="hero-carousel" id="heroList"></div>
              <button class="hero-step" data-step="1" aria-label="Next hero"></button>
            </div>
          </div>
        </section>

        <section class="menu sub" id="m-help" aria-label="How to play">
          <div class="box stone-panel">
            <header>
              <h2>How to play</h2>
              <button class="xbtn stone-btn" data-act="back">Back</button>
            </header>
            <div class="scroll">
              <div class="tabs" role="tablist" id="helpTabs"></div>
              <div id="helpBody"></div>
            </div>
          </div>
        </section>

        <section class="menu sub" id="m-layout" aria-label="Button layout"></section>
      </div>
    </div>
  </body>
</html>
