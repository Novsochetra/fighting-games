  </head>
  <body>
    <div class="loader" id="loader">
      <div class="loader-scene" aria-hidden="true"></div>
      <div class="loader-stage">
        <div
          class="loader-track"
          role="progressbar"
          aria-label="Loading"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="naga" aria-hidden="true">
            <i class="naga-tail"></i><i class="naga-body"></i><i class="naga-head"></i>
          </div>
          <div class="naga naga-gold" aria-hidden="true">
            <i class="naga-tail"></i><i class="naga-body"></i><i class="naga-head"></i>
          </div>
          <span class="loader-runner" aria-hidden="true">
            <span class="loader-dust"></span><span class="loader-hero"></span>
          </span>
        </div>
        <p class="loader-caption" aria-hidden="true">
          <span>Loading</span><span class="loader-percent">0%</span>
        </p>
      </div>
    </div>

    <div id="app">
      <div class="shell" id="shell" aria-hidden="true"></div>
      <div id="stage">
        <canvas
          id="game"
          width="768"
          height="432"
          tabindex="0"
          aria-label="Steel and Dust game screen"
        ></canvas>
      </div>

      <div class="touch live" id="touch" aria-hidden="true">
        <button class="tb-pause" id="pauseBtn" tabindex="-1" aria-label="Pause">II</button>
      </div>

      <div id="menus">
        <div class="menu-scene" id="menuScene" aria-hidden="true">
          <canvas id="titleScene" width="384" height="216"></canvas>
        </div>
        <div class="menu-dim" aria-hidden="true"></div>

        <section class="menu" id="m-title" aria-label="Main menu">
          <h1 class="logo">Steel &amp; Dust<span>pixel brawler</span></h1>
          <div class="mlist">
            <button class="mbtn primary" data-act="continueSaved" id="continueSavedBtn" hidden>
              Continue
            </button>
            <button class="mbtn primary" data-act="play" id="playBtn">Play</button>
            <button class="mbtn" data-act="leaderboard">Leaderboard</button>
            <button class="mbtn" data-act="help">How to play</button>
            <button class="mbtn" data-act="settings">Settings</button>
            <button class="mbtn" data-act="fullscreen" data-fs>Full screen</button>
            <button class="mbtn" data-act="arcade">Back to arcade</button>
          </div>
          <p class="mnote" id="titleNote"></p>
          <p class="rotate" id="rotateHint">↻ turn your phone sideways for a bigger view</p>
        </section>

        <section class="menu" id="m-pause" aria-label="Paused">
          <h2 class="mtitle">Paused</h2>
          <div class="mlist">
            <button class="mbtn primary" data-act="resume">Resume</button>
            <button class="mbtn" data-act="help">How to play</button>
            <button class="mbtn" data-act="settings">Settings</button>
            <button class="mbtn" data-act="weapon" id="weaponBtn" hidden>Weapon: Fists</button>
            <button class="mbtn" data-act="fullscreen" data-fs>Full screen</button>
            <button class="mbtn" data-act="restart">Restart</button>
            <button class="mbtn" data-act="quit">Quit to title</button>
          </div>
        </section>

        <section class="menu" id="m-over" aria-label="Defeated">
          <h2 class="mtitle bad" id="overTitle">You fell</h2>
          <p class="mnote" id="overNote"></p>
          <div class="mlist">
            <button class="mbtn primary" data-act="again" id="startOverBtn" hidden>
              Start from mission 1
            </button>
            <button class="mbtn primary" data-act="continue" id="continueBtn">Continue</button>
            <button class="mbtn" data-act="restart" id="restartMissionBtn">Restart mission</button>
            <button class="mbtn" data-act="post" id="overPostBtn" hidden>Post score online</button>
            <button class="mbtn" data-act="share" id="overShareBtn" hidden>Share</button>
            <button class="mbtn" data-act="leaderboard" id="overBoardBtn" hidden>
              Leaderboard
            </button>
            <button class="mbtn" data-act="quit">Quit to title</button>
          </div>
        </section>

        <section class="menu" id="m-clear" aria-label="All missions clear">
          <h2 class="mtitle good">All missions clear</h2>
          <div class="results">
            <div class="results-card" id="clearStats"></div>
            <div class="mlist">
              <button class="mbtn primary" data-act="again">Play again</button>
              <button class="mbtn" data-act="post" id="clearPostBtn" hidden>
                Post score online
              </button>
              <button class="mbtn" data-act="share" id="clearShareBtn" hidden>Share</button>
              <button class="mbtn" data-act="leaderboard">Leaderboard</button>
              <button class="mbtn" data-act="credits">Credits</button>
              <button class="mbtn" data-act="quit">Title</button>
              <button class="mbtn" data-act="arcade">Back to arcade</button>
            </div>
          </div>
        </section>

        <section class="menu credits" id="m-credits" aria-label="Credits">
          <div class="credits-window"></div>
          <button class="xbtn stone-btn credits-skip" data-act="back">Skip</button>
        </section>

        <section class="menu sub" id="m-settings" aria-label="Settings">
          <div class="box stone-panel">
            <header>
              <h2>Settings</h2>
              <button class="xbtn stone-btn" data-act="back">Back</button>
            </header>
            <div class="scroll" id="settingsSections"></div>
          </div>
        </section>

        <section class="menu sub" id="m-section" aria-labelledby="sectionTitle">
          <div class="box stone-panel">
            <header>
              <h2 id="sectionTitle">Settings</h2>
              <button class="xbtn stone-btn" data-act="back">Back</button>
            </header>
            <div class="scroll" id="sectionRows"></div>
          </div>
        </section>

        <section class="menu sub heroes" id="m-heroes" aria-label="Choose your hero">
          <div class="box">
            <header>
              <h2>Choose your hero</h2>
              <button class="xbtn stone-btn" data-act="back">Back</button>
            </header>
            <div class="hero-stage" id="heroStage">
              <button class="hero-step" data-step="-1" aria-label="Previous hero"></button>
              <div class="hero-carousel" id="heroList"></div>
              <button class="hero-step" data-step="1" aria-label="Next hero"></button>
            </div>
          </div>
        </section>

        <section class="menu sub" id="m-help" aria-label="How to play">
          <div class="box stone-panel">
            <header>
              <h2>How to play</h2>
              <button class="xbtn stone-btn" data-act="back">Back</button>
            </header>
            <div class="scroll">
              <div class="tabs" role="tablist" id="helpTabs"></div>
              <div id="helpBody"></div>
            </div>
          </div>
        </section>

        <section class="menu sub" id="m-leaderboard" aria-label="Leaderboard">
          <div class="box stone-panel">
            <header>
              <h2>Leaderboard</h2>
              <button class="xbtn stone-btn" data-act="back">Back</button>
            </header>
            <div class="scroll" id="leaderboardList"></div>
          </div>
        </section>

        <section class="menu sub" id="m-post" aria-label="Post your score">
          <div class="box stone-panel">
            <header>
              <h2>Post your score</h2>
              <button class="xbtn stone-btn" data-act="back">Back</button>
            </header>
            <div class="scroll" id="postPanel"></div>
          </div>
        </section>

        <section class="menu sub" id="m-skins" aria-label="Skins"></section>
      </div>
    </div>
  </body>
</html>
