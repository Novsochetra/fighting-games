<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Retro Arcade</title>
    <meta name="description" content="Pick a game and play it in your browser." />
    <meta name="theme-color" content="#0e0e10" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="src/design/tokens.css" />
    <link rel="stylesheet" href="src/home/page.css" />
    <link rel="stylesheet" href="src/home/app-grid.css" />
    <link rel="stylesheet" href="src/home/app-icon.css" />
    <link rel="stylesheet" href="src/home/notice.css" />
    <link rel="stylesheet" href="src/home/hints.css" />
    <link rel="stylesheet" href="src/home/launch.css" />
    <script type="speculationrules">
      { "prefetch": [{ "where": { "href_matches": "games/*" }, "eagerness": "moderate" }] }
    </script>
    <script type="module" src="src/home/main.js"></script>
  </head>
  <body>
    <div class="home" id="home">
      <header class="masthead">
        <h1 class="masthead__title" id="home-title">Retro Arcade</h1>
        <p class="masthead__meta" id="game-count"></p>
      </header>

      <main class="springboard">
        <div class="notice" id="notice" data-tone="loading">
          <p class="notice__message" id="status" role="status">Loading games…</p>
          <button class="button" id="retry" type="button" hidden>Try again</button>
        </div>
        <noscript>
          <p class="notice notice__message">Turn on JavaScript to see the games.</p>
        </noscript>

        <ul class="app-grid" id="app-grid" aria-labelledby="home-title" hidden></ul>
      </main>

      <footer class="hints" aria-label="Controls">
        <p class="hints__item"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> Move</p>
        <p class="hints__item"><kbd>Enter</kbd> Open</p>
        <p class="hints__item"><kbd>D-pad</kbd><kbd>A</kbd> Gamepad</p>
      </footer>
    </div>
  </body>
</html>
