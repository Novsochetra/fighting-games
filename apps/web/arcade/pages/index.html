<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Retro Arcade · Free Khmer games in your browser</title>
    <meta
      name="description"
      content="Free retro games inspired by Cambodia, right in your browser: fight to the temples of Angkor in Steel &amp; Dust, or explore them in Morodok Angkor."
    />
    <link rel="canonical" href="https://www.khmerarcade.games/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Retro Arcade" />
    <meta property="og:title" content="Retro Arcade · Free Khmer games in your browser" />
    <meta
      property="og:description"
      content="Free retro games inspired by Cambodia, right in your browser: fight to the temples of Angkor in Steel &amp; Dust, or explore them in Morodok Angkor."
    />
    <meta property="og:url" content="https://www.khmerarcade.games/" />
    <meta
      property="og:image"
      content="https://www.khmerarcade.games/assets/social/entry-screen.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Retro Arcade home screen: Steel &amp; Dust picked in a carousel of games, before Angkor Wat at sunset"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Retro Arcade",
        "alternateName": "Khmer Arcade",
        "url": "https://www.khmerarcade.games/",
        "inLanguage": "en"
      }
    </script>
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark light" />
    <script src="appearance-early.js"></script>
    <link rel="manifest" href="assets/manifest.webmanifest" vite-ignore />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
    />
    <script type="speculationrules">
      { "prefetch": [{ "where": { "href_matches": "games/*" }, "eagerness": "moderate" }] }
    </script>
    <script type="module" src="/src/main.tsx"></script>

  <body>
    <div id="root" data-screen="home"></div>
